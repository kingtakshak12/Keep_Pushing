*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.danger{background:var(--danger)}.link{background:transparent;color:var(--accent2);padding:7px 0}.app{min-height:100vh}.header{position:sticky;top:0;z-index:30;background:rgba(251,252,250,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.header-inner{max-width:1120px;margin:auto;padding:16px 132px 14px 22px;position:relative}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}h1{font-size:24px;margin:3px 0 0;letter-spacing:-.03em}.shell{max-width:1120px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 74px)}.nav{border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:74px;height:calc(100vh - 74px)}.nav button{width:100%;display:flex;gap:9px;align-items:center;margin:3px 0;background:transparent;color:var(--muted);box-shadow:none;text-align:left}.nav button.active{background:var(--soft);color:var(--accent2)}.main{padding:24px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.small{font-size:11px;color:var(--faint)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;border:1px .buddy-main{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}

 saveEdits(type,rows){Store.update(s=>{s.schedulePlan[type]=rows.map(r=>({...r,minutes:Math.max(15,+r.minutes||15)}));const p=s.schedulePlan[type].find(x=>x.type==='priority');if(p)this.reshuffle(type,p.id)})}
};
const Buddy={message(){const n=Store.state.buddy.name||'Buddy',m=Mood.get(),st=Stats.derive();if(m==='rough')return `I’m staying with you. One small thing is enough today.`;if(m==='good')return `${n} says: use the energy, but keep the pace sustainable.`;return st.streak?`${n} says: ${st.streak} days of showing up. Keep it steady.`:`${n} says: start with one useful thing.`},avatar(){return Mood.get()==='rough'?'🌧️':Mood.get()==='good'?'🔥':'🌤️'},recap(){const now=new Date(),days=[];for(let i=1;i<=7;i++){const d=new Date(now);d.setDate(d.getDate()-i);days.push(U.iso(d))}const h=Store.state.history.filter(x=>days.includes(x.date));return{count:h.length,active:new Set(h.map(x=>x.date)).size,minutes:h.reduce((a,b)=>a+(+b.minutes||0),0)}}};
const Task={timer:null,busy:false,
 pool(){return BUILTIN_TASKS.concat((Store.state.customTasks||[]).map((t,i)=>({id:t.id||`custom-${i}`,text:t.text,minutes:+t.minutes||10,category:'Custom',custom:true})))},
 candidate(){if(Store.state.currentTask)return Store.state.currentTask;const pool=this.pool();if(!pool.length)return null;let use=pool;if(Mood.get()==='rough'){const short=pool.filter(t=>t.minutes<=10);if(short.length)use=short}const choice=U.clone(use[Math.floor(Math.random()*use.length)]);Store.update(s=>s.currentTask=choice,{cloud:false});return choice},
 next(){const pool=this.pool();if(!pool.length)return;const cur=Store.state.currentTask?.id;let use=pool.filter(t=>t.id!==cur);if(!use.length)use=pool;if(Mood.get()==='rough'){const short=use.filter(t=>t.minutes<=10);if(short.length)use=short}Store.update(s=>s.currentTask=U.clone(use[Math.floor(Math.random()*use.length)]));UI.render()},
 async start(task=this.candidate()){if(!task||this.busy||Store.state.activeTask?.running)return;this.busy=true;UI.render();try{const endAt=Date.now()+(+task.minutes||10)*60000;const active={id:U.id(),source:'task',taskId:task.id||null,text:task.text,label:task.category||'Task',minutes:+task.minutes||10,startedAt:Date.now(),endAt,owner:Cloud.deviceId,running:true,remote:false};if(Cloud.user){const ok=await Cloud.claimActiveTask(active);if(!ok){toast('Another device already has a running task.');return}}Store.update(s=>s.activeTask=active,{cloud:false});this.runClock()}finally{this.busy=false;UI.render()}},
 mirror(task){if(!task||task.owner===Cloud.deviceId)return;Store.update(s=>s.activeTask={...task,running:true,remote:true},{cloud:false});this.runClock()},
 clearRemote(){if(Store.state.activeTask?.remote)Store.update(s=>s.activeTask=null,{cloud:false})},
 runClock(){clearInterval(this.timer);this.timer=setInterval(()=>{const a=Store.state.activeTask;if(!a?.running){clearInterval(this.timer);return}if(a.endAt<=Date.now()){clearInterval(this.timer);if(a.remote){Store.update(s=>s.activeTask=null,{cloud:false});UI.render()}else this.finish()}else UI.updateTimer()},1000)},
 async finish(){const a=Store.state.activeTask;if(!a||a.remote)return;const n=new Date();Store.update(s=>{s.history=s.history||[];s.history.push({date:U.today(),time:`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,text:a.text,minutes:a.minutes,source:'task'});s.activeTask=null;s.currentTask=null},{cloud:false});await Cloud.clearActiveTask();Cloud.queuePush();toast('Task completed. Nice work.');UI.render()}
};
const Cloud={user:null,Auth:null,Fs:null,auth:null,db:null,unsub:null,poll:null,pushTimer:null,lastRemoteVersion:0,deviceId:(()=>{let id=localStorage.getItem(DEVICE_KEY);if(!id){id='dev-'+U.id();localStorage.setItem(DEVICE_KEY,id)}return id})(),
 async init(){try{const [appM,authM,fsM]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]);const app=appM.initializeApp(FIREBASE_CONFIG);this.Auth=authM;this.Fs=fsM;this.auth=authM.getAuth(app);this.db=fsM.getFirestore(app);authM.onAuthStateChanged(this.auth,u=>this.onAuth(u))}catch(e){console.warn('Cloud unavailable',e)}},
 async onAuth(user){this.user=user;if(this.unsub){this.unsub();this.unsub=null}clearInterval(this.poll);if(!user){UI.render();return}const ref=this.Fs.doc(this.db,'users',user.uid);try{const snap=await this.Fs.getDoc(ref);if(snap.exists())this.applyDoc(snap.data())}catch{}this.unsub=this.Fs.onSnapshot(ref,s=>s.exists()&&this.applyDoc(s.data()),e=>console.warn(e));this.poll=setInterval(async()=>{try{const s=await this.Fs.getDoc(ref);if(s.exists())this.applyDoc(s.data())}catch{}},4000);this.queuePush();UI.render()},
 applyDoc(data){const active=data.activeTask;if(active&&active.owner!==this.deviceId&&active.endAt>Date.now())Task.mirror(active);else if(Store.state.activeTask?.remote)Task.clearRemote();const payload=data.payload;if(payload&&Number(data.payloadUpdatedAt||0)>this.lastRemoteVersion){this.lastRemoteVersion=Number(data.payloadUpdatedAt||0);const localActive=Store.state.activeTask;Store.state={...Store.state,...payload,activeTask:localActive};Storage.save(Store.state);UI.render()}},
 queuePush(){if(!this.user||!this.db)return;clearTimeout(this.pushTimer);this.pushTimer=setTimeout(()=>this.push(),500)},
 async push(){if(!this.user)return;const payload=U.clone(Store.state);delete payload.activeTask;const ts=Date.now();this.lastRemoteVersion=ts;try{await this.Fs.setDoc(this.Fs.doc(this.db,'users',this.user.uid),{payload,payloadUpdatedAt:ts},{merge:true})}catch(e){console.warn('push failed',e)}},
 async claimActiveTask(task){try{const ref=this.Fs.doc(this.db,'users',this.user.uid),snap=await this.Fs.getDoc(ref),existing=snap.exists()?snap.data().activeTask:null;if(existing&&existing.owner!==this.deviceId&&existing.endAt>Date.now())return false;await this.Fs.setDoc(ref,{activeTask:task},{merge:true});return true}catch(e){toast('Could not sync the running task. Check your connection.');return false}},
 async clearActiveTask(){if(!this.user)return;try{const ref=this.Fs.doc(this.db,'users',this.user.uid),snap=await this.Fs.getDoc(ref),a=snap.exists()?snap.data().activeTask:null;if(a?.owner===this.deviceId)await this.Fs.updateDoc(ref,{activeTask:this.Fs.deleteField()})}catch(e){console.warn(e)}},
 async login(email,password){await this.Auth.signInWithEmailAndPassword(this.auth,email,password)},async signup(email,password){await this.Auth.createUserWithEmailAndPassword(this.auth,email,password)},async google(){await this.Auth.signInWithPopup(this.auth,new this.Auth.GoogleAuthProvider())},async logout(){await this.clearActiveTask();await this.Auth.signOut(this.auth)}
};
let view='today',scheduleEdit=false,scheduleView=null,buddyOpen=false,clockOpen=false,quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3500)}
const UI={
 render(){document.getElementById('app').innerHTML=this.layout();this.bind();this.updateTimer()},
 layout(){return `<div class="app"><header class="header"><div class="header-inner"><div class="eyebrow">Keep Pushing 2.0</div><h1>${view==='today'?'Today':view[0].toUpperCase()+view.slice(1)}</h1>${view==='today'?this.clock():''}</div></header><div class="shell">${this.nav('nav')}<main class="main">${this.content()}</main></div>${this.nav('mobile-nav')}</div>`},
 nav(cls){return `<nav class="${cls}">${[['today','🏠','Today'],['tasks','✅','Tasks'],['schedule','🗓️','Schedule'],['journal','📓','Journal'],['account','☁️','Account']].map(([id,ic,t])=>`<button data-nav="${id}" class="${view===id?'active':''}">${ic} ${t}</button>`).join('')}</nav>`},
 content(){if(view==='tasks')return this.tasks();if(view==='schedule')return this.schedule();if(view==='journal')return this.journal();if(view==='account')return this.account();return this.today()},
 clock(){const now=new Date(),m=now.getHours()*60+now.getMinutes(),h=now.getHours()%12||12,ap=now.getHours()>=12?'PM':'AM';const {cur,next}=Schedule.current(),shown=cur||next;let mins=0;if(cur)mins=Math.max(0,U.timeToMin(cur.start)+cur.minutes-m);else if(next)mins=Math.max(0,U.timeToMin(next.start)-m);const streak=shown?Schedule.streak(shown):{count:0,lastDate:''};const streakText=!shown?'No more tasks today':streak.lastDate===U.today()?`Great job — ${streak.count}-day streak`:(streak.count?`${streak.count}-day streak · today makes ${streak.count+1}`:'Complete it today to start a streak');return `<div class="clock-wrap"><button class="round-clock" id="clockBtn"><div class="clock-time">${h}:${String(now.getMinutes()).padStart(2,'0')} <span class="small">${ap}</span></div><div class="clock-task">${U.esc(shown?.label||'Day complete')}</div><div class="clock-next">${shown?`${mins} min`:''}</div></button><div class="clock-pop ${clockOpen?'show':''}" id="clockPop"><div class="small">${cur?'CURRENT TASK':next?'NEXT TASK':'SCHEDULE'}</div><h3>${U.esc(shown?.label||'Day complete')}</h3><div class="muted">${U.esc(shown?.text||'No more scheduled tasks today.')}</div><div class="notice" style="margin-top:10px">🔥 ${streakText}</div></div></div>`},
 buddy(){const name=U.esc(Store.state.buddy?.name||'Buddy'),mood=Mood.get()||'okay';const emoji=mood==='rough'?'🌧️':mood==='good'?'🔥':'✨';const msg=mood==='rough'?"I'm staying with you. Let's make the next step tiny.":mood==='good'?"You've got momentum. Let's use it well.":"I'm here. One task at a time.";return `<section class="card"><div class="buddy-main"><div class="buddy-orb" aria-hidden="true">${emoji}</div><div class="buddy-copy"><div class="small">YOUR BUDDY</div><h2>${name}</h2><div class="muted">${U.esc(msg)}</div><div class="buddy-actions"><button class="secondary" id="buddyHubBtn">🫶 Check in</button><button class="secondary" id="buddyNextTask">🎯 Give me a task</button></div></div></div><div class="buddy-hub" id="buddyHub"><div class="card" style="box-shadow:none;margin:0 0 10px"><div class="small">HOW ARE YOU FEELING?</div><div class="row"><button class="secondary" data-mood="rough">😩 Rough</button><button class="secondary" data-mood="okay">🙂 Okay</button><button class="secondary" data-mood="good">💪 Good</button></div></div><div class="card" style="box-shadow:none;margin:0 0 10px"><div class="small">WEEKLY RECAP</div><div class="muted">${this.weeklyRecapText()}</div></div><div class="card" style="box-shadow:none;margin:0"><div class="small">I'M STAYING WITH YOU</div><div>${U.esc(msg)}</div></div></div></section>`},
 weeklyRecapText(){const h=Store.state.history||[];const now=new Date();const start=new Date(now);start.setDate(now.getDate()-6);const recent=h.filter(x=>new Date(x.date+'T00:00:00')>=new Date(start.getFullYear(),start.getMonth(),start.getDate()));const mins=recent.reduce((a,x)=>a+(+x.minutes||0),0);return recent.length?`${recent.length} tasks completed in the last 7 days · ${mins} focused minutes.`:'No completed tasks in the last 7 days yet.'},
 task(){const a=Store.state.activeTask,c=Task.candidate();if(a?.running){const left=Math.max(0,Math.ceil((a.endAt-Date.now())/1000));return `<section class="card"><div class="live-badge">${a.remote?'☁ Live from another device':'● In progress'}</div><div class="task-name">${U.esc(a.text)}</div><div class="timer" id="timer">${U.fmtSecs(left)}</div><div class="muted">${a.remote?'This timer is controlled by your other signed-in device.':'Stay with it. One task only.'}</div></section>`}return `<section class="card"><div class="small">BUDDY TASK</div><div class="task-name">${U.esc(c?.text||'No task available')}</div><div class="muted">${c?`${U.esc(c.category||'Task')} · about ${c.minutes} min`:'Add a custom task in Tasks.'}</div>${c?`<div class="task-tools"><button id="startTask" ${Task.busy?'disabled':''}>${Task.busy?'Starting…':'Start task'}</button><button class="secondary" id="nextTask">↻ Give me another</button></div>`:''}</section>`},
 today(){return `${this.buddy()}${this.task()}${this.note()}`},
 tasks(){const custom=Store.state.customTasks||[];return `<section class="card"><div class="small">TASK SYSTEM</div><h2 style="margin:3px 0 6px">Your tasks</h2><div class="muted">Buddy tasks are separate from Schedule.</div><div class="task-add"><div class="field"><label>Task</label><input id="newTaskText" placeholder="e.g. Revise chapter 4"></div><div class="field"><label>Minutes</label><input id="newTaskMinutes" type="number" min="1" max="240" value="20"></div><button id="addTask">Add task</button></div></section><section class="card"><h3>Built-in Buddy tasks</h3><div class="task-list">${BUILTIN_TASKS.map(t=>`<div class="task-item"><div><div class="task-item-title">${U.esc(t.text)} <span class="task-source">${U.esc(t.category)}</span></div><div class="task-item-meta">${t.minutes} min</div></div><button class="secondary" data-use-task="${t.id}">Use now</button></div>`).join('')}</div></section><section class="card"><h3>Your custom tasks</h3>${custom.length?`<div class="task-list">${custom.map((t,i)=>`<div class="task-item"><div><div class="task-item-title">${U.esc(t.text)} <span class="task-source">Custom</span></div><div class="task-item-meta">${+t.minutes||10} min</div></div><div class="row"><button class="secondary" data-use-custom="${i}">Use now</button><button class="danger" data-remove-task="${i}">Remove</button></div></div>`).join('')}</div>`:'<div class="muted">No custom tasks yet.</div>'}</section>`},

 schedule(){const type=scheduleView||Schedule.type(),plan=Schedule.sorted(type),today=type===Schedule.type(),done=today?Schedule.doneMap():{},doneCount=today?plan.filter(x=>done[x.id]).length:0;return `<section class="card"><div class="schedule-head"><div><h2 style="margin:0">${type==='rough'?'Rough day':type[0].toUpperCase()+type.slice(1)} schedule</h2><div class="muted">3:00 AM–10:30 PM · static tasks stay fixed; priority tasks move flexible tasks.</div></div><div class="row"><select id="scheduleType" style="width:auto"><option value="weekday" ${type==='weekday'?'selected':''}>Weekday</option><option value="weekend" ${type==='weekend'?'selected':''}>Weekend</option><option value="holiday" ${type==='holiday'?'selected':''}>Holiday</option><option value="rough" ${type==='rough'?'selected':''}>Rough day</option></select><button class="secondary" id="editSchedule">${scheduleEdit?'Done editing':'✏️ Edit schedule'}</button></div></div>${today?`<div class="progress"><i style="width:${plan.length?doneCount/plan.length*100:0}%"></i></div><div class="small" style="margin:6px 0 12px">${doneCount}/${plan.length} schedule tasks completed today</div>`:''}${scheduleEdit?this.scheduleEditor(type,plan):plan.map(s=>this.scheduleRow(s,today,done)).join('')}</section>`},
 scheduleRow(s,today,done){const st=Schedule.streak(s);return `<div class="schedule-row ${done[s.id]?'done':''}"><div class="schedule-time">${U.fmtClock(U.timeToMin(s.start))}<div class="small">${s.minutes} min</div></div><div><div class="schedule-label">${U.esc(s.label)} <span class="badge">${s.type==='static'?'🔒 Static':s.type==='priority'?'⚡ Priority':'↔ Flexible'}</span>${st.count?`<span class="badge">🔥 ${st.count}</span>`:''}</div><div class="schedule-text">${U.esc(s.text)}</div></div>${today?`<button class="${done[s.id]?'secondary':''}" data-complete="${s.id}" ${done[s.id]?'disabled':''}>${done[s.id]?'✓ Done':'Complete'}</button>`:''}</div>`},
 scheduleEditor(type,plan){return `<div id="editor">${plan.map(s=>`<div class="edit-row" data-id="${s.id}"><div class="field"><label>Start</label><input type="time" data-f="start" value="${s.start}"></div><div class="field"><label>Minutes</label><input type="number" min="15" step="5" data-f="minutes" value="${s.minutes}"></div><div class="field"><label>Type</label><select data-f="type"><option value="flexible" ${s.type==='flexible'?'selected':''}>Flexible</option><option value="static" ${s.type==='static'?'selected':''}>Static</option><option value="priority" ${s.type==='priority'?'selected':''}>Priority</option></select></div><div class="field wide"><label>Task</label><input data-f="text" value="${U.esc(s.text)}"></div><div class="field"><label>Label</label><input data-f="label" value="${U.esc(s.label)}"></div><button class="danger" data-remove="${s.id}">Remove</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><button id="saveSchedule">Save schedule</button><button class="secondary" id="addSchedule">+ Add task</button><button class="link" id="resetSchedule">Reset default</button></div>`},
 journal(){const entries=Object.entries(Store.state.journal).sort((a,b)=>b[0].localeCompare(a[0]));return `<section class="card"><h2>Journal</h2><div class="muted">A simple private note for each day.</div><textarea id="journalText" style="margin-top:12px" placeholder="What’s on your mind?">${U.esc(Store.state.journal[U.today()]||'')}</textarea><button id="saveJournal" style="margin-top:8px">Save today</button></section><section class="card"><h3>Recent entries</h3>${entries.length?entries.slice(0,10).map(([d,t])=>`<div class="journal-entry"><b>${d}</b><div>${U.esc(t)}</div></div>`).join(''):'<div class="muted">No entries yet.</div>'}</section>`},
 account(){if(!Cloud.Auth)return `<section class="card"><h2>Account</h2><div class="notice">Cloud services are loading or unavailable. Local mode still works.</div></section>`;if(Cloud.user)return `<section class="card"><h2>Account</h2><div class="notice">☁ Signed in as <b>${U.esc(Cloud.user.email||'Google account')}</b>. Progress and the active task sync through the same account.</div><button class="secondary" id="logout" style="margin-top:12px">Sign out</button></section>`;return `<section class="card"><h2>Sign in</h2><div class="grid"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><div class="row" style="margin-top:12px"><button id="login">Sign in</button><button class="secondary" id="signup">Create account</button><button class="secondary" id="google">Google</button></div><div class="muted" style="margin-top:10px">Use the same account on phone and computer to mirror a running task.</div></section>`},
 updateTimer(){const el=document.getElementById('timer'),a=Store.state.activeTask;if(el&&a?.running)el.textContent=U.fmtSecs(Math.max(0,Math.ceil((a.endAt-Date.now())/1000)))},
 bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;clockOpen=false;this.render()});const cb=document.getElementById('clockBtn');if(cb)cb.onclick=e=>{e.stopPropagation();clockOpen=!clockOpen;this.render()};const bt=document.getElementById('buddyToggle');if(bt)bt.onclick=()=>{buddyOpen=!buddyOpen;this.render()};document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{Mood.set(b.dataset.mood);buddyOpen=true;this.render()});const st=document.getElementById('startTask');if(st)st.onclick=()=>Task.start();const nt=document.getElementById('nextTask');if(nt)nt.onclick=()=>Task.next();const bh=document.getElementById('buddyHubBtn'),hub=document.getElementById('buddyHub');if(bh&&hub)bh.onclick=()=>hub.classList.toggle('show');const bnt=document.getElementById('buddyNextTask');if(bnt)bnt.onclick=()=>Task.next();document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{Mood.set(b.dataset.mood);UI.render()});const at=document.getElementById('addTask');if(at)at.onclick=()=>{const text=(document.getElementById('newTaskText')?.value||'').trim(),minutes=Math.max(1,Math.min(240,+document.getElementById('newTaskMinutes')?.value||20));if(!text)return toast('Write a task first.');Store.update(s=>{s.customTasks=s.customTasks||[];s.customTasks.push({id:U.id(),text,minutes});s.currentTask=null});UI.render()};document.querySelectorAll('[data-use-task]').forEach(b=>b.onclick=()=>{const t=BUILTIN_TASKS.find(x=>x.id===b.dataset.useTask);if(t){Store.update(s=>s.currentTask=U.clone(t));view='today';UI.render()}});document.querySelectorAll('[data-use-custom]').forEach(b=>b.onclick=()=>{const t=(Store.state.customTasks||[])[+b.dataset.useCustom];if(t){Store.update(s=>s.currentTask={id:t.id||U.id(),text:t.text,minutes:+t.minutes||10,category:'Custom',custom:true});view='today';UI.render()}});document.querySelectorAll('[data-remove-task]').forEach(b=>b.onclick=()=>{Store.update(s=>{s.customTasks.splice(+b.dataset.removeTask,1);s.currentTask=null});UI.render()});const nq=document.getElementById('newQuote');if(nq)nq.onclick=()=>{quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];this.render()};const sn=document.getElementById('saveNote');if(sn)sn.onclick=()=>Store.update(s=>s.personalNote=document.getElementById('note').value);const sel=document.getElementById('scheduleType');if(sel)sel.onchange=()=>{scheduleView=sel.value;this.render()};const es=document.getElementById('editSchedule');if(es)es.onclick=()=>{scheduleEdit=!scheduleEdit;this.render()};document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const slot=Schedule.plan().find(x=>x.id===b.dataset.complete);if(slot)Schedule.markDone(slot);this.render()});const ss=document.getElementById('saveSchedule');if(ss)ss.onclick=()=>this.saveScheduleEditor();const as=document.getElementById('addSchedule');if(as)as.onclick=()=>{const type=scheduleView||Schedule.type();Store.update(s=>s.schedulePlan[type].push({id:U.id(),label:'New task',start:'09:00',text:'New scheduled task',minutes:30,type:'flexible'}));this.render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const type=scheduleView||Schedule.type();Store.update(s=>s.schedulePlan[type]=s.schedulePlan[type].filter(x=>x.id!==b.dataset.remove));this.render()});const rs=document.getElementById('resetSchedule');if(rs)rs.onclick=()=>{Schedule.reset(scheduleView||Schedule.type());this.render()};const sj=document.getElementById('saveJournal');if(sj)sj.onclick=()=>Store.update(s=>s.journal[U.today()]=document.getElementById('journalText').value);const lo=document.getElementById('logout');if(lo)lo.onclick=()=>Cloud.logout();const li=document.getElementById('login');if(li)li.onclick=()=>Cloud.login(document.getElementById('email').value,document.getElementById('password').value).catch(e=>toast(e.message));const su=document.getElementById('signup');if(su)su.onclick=()=>Cloud.signup(document.getElementById('email').value,document.getElementById('password').value).catch(e=>toast(e.message));const go=document.getElementById('google');if(go)go.onclick=()=>Cloud.google().catch(e=>toast(e.message));document.onclick=e=>{if(clockOpen&&!e.target.closest('.clock-wrap')){clockOpen=false;this.render()}}},
 saveScheduleEditor(){const type=scheduleView||Schedule.type(),rows=[];document.querySelectorAll('#editor .edit-row').forEach(row=>{const get=f=>row.querySelector(`[data-f="${f}"]`).value;rows.push({id:row.dataset.id,start:get('start'),minutes:+get('minutes')||30,type:get('type'),text:get('text').trim()||'Scheduled task',label:get('label').trim()||'Task'})});Schedule.saveEdits(type,rows);scheduleEdit=false;this.render()}
};
Store.subscribe(()=>UI.render());
UI.render();
Task.runClock();
Cloud.init();
setInterval(()=>{if(view==='today'){const had=clockOpen;UI.render();clockOpen=had}},30000);
})();
