<title>Keep Pushing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: #241934;
  }
  .frame-outer {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 0;
    overflow-x: hidden;
  }
  .frame-box { width: 100%; height: 100%; overflow-x: hidden; position: relative; }
  #bgCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #toastLayer {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 8px;
    width: min(90%, 380px); pointer-events: none;
  }
  .toast {
    pointer-events: auto; background: var(--ink-light); color: #FFF6EC;
    border-radius: 8px; padding: 11px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    border-left: 4px solid var(--amber); animation: toastIn 0.25s ease;
  }
  .toast-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; padding-right: 18px; }
  .toast-body { font-size: 12px; color: #DCD2EC; line-height: 1.35; }
  .toast-close {
    float: right; margin: -2px -4px 0 0; background: none; border: none;
    color: #DCD2EC; cursor: pointer; font-size: 13px; padding: 2px 6px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; }
  }
  @media (min-width: 640px) {
    .frame-outer { padding: 32px 16px; align-items: center; }
    .frame-box {
      border: 1px solid #3F6B4A;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      height: 820px;
      max-height: calc(100vh - 64px);
    }
  }
  @media (min-width: 900px) {
    .frame-box { max-width: 820px; }
  }
  @media (min-width: 1200px) {
    .frame-box { max-width: 1040px; }
  }

<style id="buddy-system-styles">
  /* ===== Motivation Buddy system ===== */
  .app-shell {
    transition: background-color .9s ease, color .6s ease;
  }
  .app-shell .app-body,
  .app-shell .app-header,
  .app-shell .panel,
  .app-shell .mood-card,
  .app-shell .task-card,
  .app-shell .quote-card,
  .app-shell .note-card {
    transition: background-color .9s ease, border-color .9s ease, color .6s ease, box-shadow .9s ease;
  }

  .buddy-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 12px 28px rgba(0,0,0,.12);
  }
  .buddy-card::before {
    content: "";
    position: absolute;
    width: 160px;
    height: 160px;
    right: -60px;
    top: -70px;
    border-radius: 50%;
    background: var(--amber);
    opacity: .12;
    animation: buddyAura 3.8s ease-in-out infinite;
  }
  .buddy-row {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  .buddy-art-wrap {
    flex: 0 0 92px;
    min-height: 100px;
    display: grid;
    place-items: center;
    position: relative;
  }
  .buddy-art-wrap::after {
    content: "";
    position: absolute;
    bottom: 4px;
    width: 66px;
    height: 12px;
    border-radius: 50%;
    background: var(--amber);
    opacity: .14;
    filter: blur(5px);
  }
  .buddy-art {
    width: 92px;
    height: 108px;
    position: relative;
    z-index: 2;
    animation: buddyFloat 3s ease-in-out infinite;
  }
  .buddy-art.buddy-rough { animation: buddyComfort 3.2s ease-in-out infinite; }
  .buddy-art.buddy-good { animation: buddyCheer .8s ease-in-out infinite alternate; }
  .buddy-copy { flex: 1; min-width: 0; }
  .buddy-kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-faint);
    font-weight: 800;
    margin-bottom: 5px;
  }
  .buddy-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink-light);
    margin-bottom: 6px;
  }
  .buddy-message {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .buddy-action {
    width: auto;
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 12px;
  }
  .buddy-mood-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--bg-panel-2);
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .buddy-stage-note {
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 10px;
    font-style: italic;
  }
  .shield-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
    vertical-align: middle;
  }
  /* Buddy visually grows with streak: bigger + glowier at higher stages */
  .buddy-stage-1 { transform: scale(1.06); }
  .buddy-stage-2 { transform: scale(1.12); filter: drop-shadow(0 0 6px var(--amber)); }
  .buddy-stage-3 { transform: scale(1.2); filter: drop-shadow(0 0 10px var(--amber)); }
  .buddy-stage-4 { transform: scale(1.3); filter: drop-shadow(0 0 16px var(--amber)); }

  /* Character onboarding */
  .buddy-onboarding {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 22px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,138,61,.18), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(47,182,165,.14), transparent 30%),
      linear-gradient(160deg, #180F26, #2C1F42 55%, #160C22);
    color: #fff;
    overflow: auto;
  }
  .buddy-onboarding-card {
    width: min(560px, 100%);
    padding: 28px;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(20,13,38,.82);
    backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0,0,0,.4);
    animation: buddyOnboardIn .65s cubic-bezier(.2,.8,.2,1) both;
    text-align: center;
  }
  .buddy-sparkle {
    font-size: 28px;
    margin-bottom: 5px;
    animation: buddySparkle 2s ease-in-out infinite;
  }
  .buddy-onboarding h2 {
    margin: 0 0 8px;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: -.02em;
  }
  .buddy-onboarding p {
    margin: 0 auto 20px;
    max-width: 430px;
    color: rgba(255,255,255,.74);
    line-height: 1.55;
  }
  .buddy-gender-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 18px 0;
  }
  .buddy-gender-btn {
    min-height: 160px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: #fff;
    border-radius: 20px;
    padding: 14px;
    cursor: pointer;
    box-shadow: none;
  }
  .buddy-gender-btn:hover { background: rgba(255,255,255,.1); }
  .buddy-gender-btn.active {
    border-color: #FFB23D;
    background: rgba(255,178,61,.13);
    box-shadow: 0 0 0 2px rgba(255,178,61,.22), 0 12px 30px rgba(0,0,0,.18);
  }
  .buddy-gender-emoji { font-size: 58px; display: block; margin-bottom: 8px; }
  .buddy-gender-label { font-size: 16px; font-weight: 800; }
  .buddy-name-input {
    width: 100%;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07);
    color: #fff;
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 16px;
    outline: none;
  }
  .buddy-name-input::placeholder { color: rgba(255,255,255,.42); }
  .buddy-name-input:focus {
    border-color: #FFB23D;
    box-shadow: 0 0 0 3px rgba(255,178,61,.12);
  }
  .buddy-create-btn {
    margin-top: 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, #FF7B62, #FFB23D);
    color: #28130B;
    font-size: 16px;
    padding: 15px;
  }
  .buddy-onboard-preview {
    margin: 12px auto 0;
    min-height: 100px;
    display: grid;
    place-items: center;
  }

  /* Buddy settings */
  .buddy-settings-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-panel-2);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .buddy-mini-art { width: 58px; height: 68px; flex: 0 0 58px; }
  .buddy-mini-copy { flex: 1; }
  .buddy-mini-name { font-weight: 800; font-size: 17px; }
  .buddy-mini-meta { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  /* Mood celebration / transition */
  #buddyMoodBurst {
    position: fixed;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
    display: grid;
    place-items: center;
    opacity: 0;
  }
  #buddyMoodBurst.show { animation: moodBurst .95s ease both; }
  .buddy-burst-card {
    padding: 15px 20px;
    border-radius: 999px;
    background: rgba(25,18,40,.9);
    color: #fff;
    box-shadow: 0 14px 45px rgba(0,0,0,.28);
    text-align: center;
    font-weight: 800;
    font-size: 14px;
  }

  @keyframes buddyFloat {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1deg); }
  }
  @keyframes buddyComfort {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-3px) rotate(2deg); }
  }
  @keyframes buddyCheer {
    from { transform: translateY(0) rotate(-3deg) scale(1); }
    to { transform: translateY(-8px) rotate(3deg) scale(1.04); }
  }
  @keyframes buddyAura {
    0%,100% { transform: scale(.92); opacity: .08; }
    50% { transform: scale(1.12); opacity: .18; }
  }
  @keyframes buddyOnboardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes buddySparkle {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.15) rotate(6deg); }
  }
  @keyframes moodBurst {
    0% { opacity: 0; transform: scale(.82); }
    18% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.06); }
  }

  @media (max-width: 520px) {
    .buddy-row { align-items: flex-start; }
    .buddy-art-wrap { flex-basis: 76px; }
    .buddy-art { width: 76px; height: 89px; }
    .buddy-name { font-size: 19px; }
    .buddy-message { font-size: 13px; }
    .buddy-onboarding-card { padding: 22px 18px; }
    .buddy-gender-btn { min-height: 135px; }
    .buddy-gender-emoji { font-size: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .buddy-art, .buddy-card::before, .buddy-sparkle,
    .buddy-onboarding-card, #buddyMoodBurst.show {
      animation: none !important;
    }
    .app-shell .app-body, .app-shell .app-header, .app-shell .panel,
    .app-shell .mood-card, .app-shell .task-card, .app-shell .quote-card,
    .app-shell .note-card { transition: none !important; }
  }
</style>

<style id="floating-buddy-system">

<style id="enhanced-animations">
  /* === Keep Pushing — enhanced motion layer === */
  @keyframes kpFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes kpFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes kpPop {
    0% { opacity: 0; transform: scale(.86); }
    70% { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes kpPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  @keyframes kpFlame {
    0%, 100% { transform: rotate(-2deg) scaleY(1); transform-origin: 70px 76px; }
    50% { transform: rotate(2deg) scaleY(1.08); transform-origin: 70px 76px; }
  }
  @keyframes kpSpark {
    0% { opacity: 0; transform: translateY(8px) scale(.5); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px) scale(1.15); }
  }
  @keyframes kpCheck {
    0% { opacity: 0; transform: scale(.5) rotate(-8deg); }
    70% { transform: scale(1.12) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes kpNumber {
    0% { opacity: .2; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes kpConfetti {
    0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(720deg); }
  }

  /* Smooth page/tab content entrance */
  #app .content { animation: kpFadeIn .32s ease both; }
  #app .panel, #app .task-card, #app .mood-card, #app .note-card,
  #app .quote-card, #app .sched-block, #app .stat {
    animation: kpFadeUp .36s ease both;
  }

  /* Interactive polish */
  #app button:not(:disabled) {
    transition: transform .16s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
  }
  #app button:not(:disabled):hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,.12);
  }
  #app button:not(:disabled):active {
    transform: translateY(1px) scale(.985);
  }
  .tab-btn { transition: background .2s ease, color .2s ease, transform .16s ease; }
  .tab-btn:hover { transform: translateX(2px); }
  .video-card { transition: transform .2s ease, box-shadow .2s ease; }
  .video-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }

  /* Lamp flame */
  .lamp-wrap svg .kp-flame {
    animation: kpFlame 1.25s ease-in-out infinite;
  }
  .lamp-wrap svg .kp-glow {
    animation: kpPulse 2.4s ease-in-out infinite;
    transform-origin: 70px 70px;
  }

  /* Completion state */
  .kp-completed {
    animation: kpPop .42s cubic-bezier(.2,.8,.2,1) both;
  }
  .done-msg {
    animation: kpCheck .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .kp-stat-number {
    display: inline-block;
    animation: kpNumber .35s ease both;
  }

  /* Final timer countdown */
  .kp-timer-final {
    animation: kpPulse .65s ease-in-out infinite;
  }

  /* Celebration overlay */
  #kpCelebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .kp-confetti-piece {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 7px;
    height: 12px;
    border-radius: 2px;
    background: var(--kp-confetti, var(--amber));
    animation: kpConfetti .85s cubic-bezier(.15,.75,.25,1) forwards;
  }
  .kp-celebrate-badge {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--bg-panel);
    color: var(--ink-light);
    border: 1px solid var(--line);
    box-shadow: 0 12px 34px rgba(0,0,0,.2);
    font-weight: 800;
    animation: kpPop .45s ease both;
  }

  @media (prefers-reduced-motion: reduce) {
    #app .content, #app .panel, #app .task-card, #app .mood-card,
    #app .note-card, #app .quote-card, #app .sched-block, #app .stat,
    .lamp-wrap svg .kp-flame, .lamp-wrap svg .kp-glow, .kp-completed,
    .done-msg, .kp-stat-number, .kp-timer-final, .kp-confetti-piece,
    .kp-celebrate-badge {
      animation: none !important;
    }
    #app button:not(:disabled), .tab-btn, .video-card {
      transition: none !important;
    }
  }
</style>
<style>
  :root {

  /* Mood themes — scoped to .app-shell so every tab/panel picks up the

     - okay: the app's normal balanced palette

    --bg-panel-2: #F5E1D3;

    --ink-light: #4A342E;
    --ink-soft: #8A6B5E;
    --ink-faint: #BFA294;
    --amber: #E8927C;
    --amber-dim: #D97A61;
    --teal: #D9B171;
    --rust: #C97A6A;
    --line: #EAD4C4;
    --radius: 14px;
    --radius-lg: 20px;
  }
  .app-shell.mood-okay {
    --bg-deep: #241934;
    --bg-panel: #FFFFFF;
    --bg-panel-2: #F3ECFB;
    --paper: #FFFBEF;
    --ink-light: #241934;
    --amber: #FF8A3D;
    --amber-dim: #E06A1F;

    --line: #E4DCF2;
    --radius: 4px;
    --radius-lg: 4px;

  .app-shell.mood-good {
    --bg-deep: #341409;
    --bg-panel: #FFF9F0;
    --bg-panel-2: #FFEFD9;
    --paper: #FFF4DC;
    --paper-line: #F5CE8E;
    --ink-light: #3A1B0C;
    --ink-soft: #8A5A32;
    --ink-faint: #C79A6B;
    --amber: #FF5A1F;
    --amber-dim: #E8430A;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-deep); }

  #app {

  }
  .menu-backdrop.open { display: block; }

  /* ---- Header + signature lamp ---- */

  /* ---- Stats ---- */
  .stats-row { display: flex; gap: 10px; }

  .stat .num { font-size: 24px; font-weight: 700; color: var(--amber); font-family: Georgia, serif; }

  /* ---- Task card ---- */

  button {

  .day-detail { margin-top: 12px; background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .day-detail-journal { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }

  .panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }

      body: "Nothing dramatic needed — just keep showing up. Small, consistent steps are what actually build the streak.",
      tips: [
        "One task, done well, is a win.",
        "If you find extra energy partway through, feel free to do another."

    good: {
      title: "Good energy — let's use it",
      body: "Nice, you've got some momentum today. Use it while it's here — take on the task, and if you're still going after, come back for another.",

        "Consider a slightly bigger or harder task than usual.",
        "Finished early? Hit 'Skip, give me another' for a bonus round."

  // Small original illustrations (hand-coded, no external images/IP) that
  // shift with mood — warm and cozy for rough days, steady for okay,

  function renderMoodGuidance() {
    const mood = todaysMood();
    if (!mood || moodNeedsCheckin()) return "";
    const g = MOOD_GUIDANCE[mood];
    if (!g) return "";
    const showVideo = mood === "rough" || mood === "good";
    let videoBlock = "";
    if (showVideo) {
      const v = pickMeUpVideo();
      const vidKey = extractYouTubeId(v.url) || v.url;
      const cta = mood === "rough" ? "Watch something to lift you up" : "Ride the momentum — watch this";
      videoBlock = `
        <button id="pickMeUpVideoBtn" data-vidkey="${esc(vidKey)}" class="link-btn" style="margin-top:10px; display:block;">
          ▶ ${esc(cta)}: "${esc(v.title || v.url)}"
        </button>
      `;
    }
    return `
      <div class="panel" style="margin-bottom:14px;">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
          ${moodIllustrationSVG(mood)}
          <div>
            <div class="panel-title" style="margin-bottom:4px;">${esc(g.title)}</div>
            <div class="note-text">${esc(g.body)}</div>
          </div>
        </div>
        <ul style="margin:0; padding-left:18px; color:var(--ink-soft); font-size:13px; line-height:1.6;">
          ${g.tips.map(t => `<li>${esc(t)}</li>`).join("")}
        </ul>
        ${videoBlock}
        <button id="changeMoodBtn" class="link-btn" style="margin-top:10px; display:block;">Actually, I feel different — change it</button>
      </div>
    `;
  }

  // ---------- Whole-day schedule (weekday / weekend / holiday plans, any number of slots) ----------
  function makeSlot(overrides) {
    return Object.assign({
      id: "s" + Math.random().toString(36).slice(2, 9),
      label: "", time: "", text: "", minutes: "", remindAt: ""
    }, overrides || {});
  }

  const DEFAULT_PLAN_TEMPLATES = {
    weekday: [
      { label: "Early Morning", time: "6–9 AM" },
      { label: "Morning", time: "9 AM–12 PM" },
      { label: "Midday", time: "12–2 PM" },
      { label: "Afternoon", time: "2–5 PM" },
      { label: "Evening", time: "5–8 PM" },
      { label: "Night", time: "8–10 PM" }
    ],
    weekend: [
      { label: "Early Morning", time: "7–10 AM" },
      { label: "Morning", time: "10 AM–1 PM" },
      { label: "Afternoon", time: "1–5 PM" },
      { label: "Evening", time: "5–9 PM" }
    ],
    holiday: [
      { label: "Slow start", time: "Morning" },
      { label: "Something for you", time: "Midday" },
      { label: "One small task", time: "Afternoon" },
      { label: "Rest & recharge", time: "Evening" }
    ]
  };

  const PLAN_LABELS = { weekday: "Weekday", weekend: "Weekend", holiday: "Holiday" };

  function dayType(d) {
    const iso = localIso(d);
    if ((saved.holidayDates || {})[iso]) return "holiday";
    const day = d.getDay();
    return (day === 0 || day === 6) ? "weekend" : "weekday";
  }

  function getSchedulePlan(type) {
    saved.schedulePlan = saved.schedulePlan || {};
    const existing = saved.schedulePlan[type];
    if (Array.isArray(existing)) return existing;

    // migrate the old fixed-key format if present, otherwise seed sensible defaults
    let slots;
    if (existing && typeof existing === "object") {
      slots = Object.keys(existing).map(k => makeSlot({
        label: k, time: existing[k].time, text: existing[k].text, minutes: existing[k].minutes
      }));
    } else {
      slots = (DEFAULT_PLAN_TEMPLATES[type] || DEFAULT_PLAN_TEMPLATES.weekday).map(s => makeSlot(s));
    }
    saved.schedulePlan[type] = slots;
    persist();
    return slots;
  }

  function getTodayDoneMap() {
    saved.scheduleLog = saved.scheduleLog || {};
    const today = todayStr();
    if (!saved.scheduleLog[today]) saved.scheduleLog[today] = {};
    return saved.scheduleLog[today];
  }

  function isTodayMarkedHoliday() {
    return !!((saved.holidayDates || {})[todayStr()]);
  }

  function toggleTodayHoliday() {
    saved.holidayDates = saved.holidayDates || {};
    const today = todayStr();
    if (saved.holidayDates[today]) delete saved.holidayDates[today];
    else saved.holidayDates[today] = true;
    persist();
  }

  function renderSchedule() {
    const actualType = dayType(new Date());
    const viewType = scheduleView || actualType;
    const isToday = viewType === actualType;
    const plan = getSchedulePlan(viewType);
    const doneMap = isToday ? getTodayDoneMap() : null;
    const doneCount = isToday ? plan.filter(s => doneMap[s.id]).length : 0;

    return `
      <div class="sched-toggle">
        ${["weekday", "weekend", "holiday"].map(t => `
          <button class="sched-toggle-btn ${viewType === t ? "active" : ""}" data-view="${t}">${PLAN_LABELS[t]}</button>
        `).join("")}
      </div>
      <div class="schedule-intro">
        ${isToday
          ? `Today's plan (${PLAN_LABELS[viewType].toLowerCase()}). ${doneCount}/${plan.length} done so far.`
          : `Editing your ${PLAN_LABELS[viewType].toLowerCase()} plan ahead of time — this doesn't apply until a ${PLAN_LABELS[viewType].toLowerCase()} day.`}
      </div>
      <button id="toggleHolidayBtn" class="link-btn" style="margin-bottom:14px;">
        ${isTodayMarkedHoliday() ? "↩ Unmark today as a holiday" : "🎉 Mark today as a holiday"}
      </button>
      ${plan.map(slot => {
        const done = isToday && doneMap[slot.id];
        if (done) {
          return `
            <div class="sched-block sched-done">
              <div class="sched-time">${esc(slot.label || "Slot")} <span class="sched-timerange">${esc(slot.time)}</span></div>
              <div class="sched-task">${esc(slot.text)}</div>
              <div class="done-msg">✓ Done</div>
            </div>
          `;
        }
        return `
          <div class="sched-block">
            <div class="sched-time-row">
              <input type="text" class="note-input sched-label-input" data-id="${slot.id}" data-view="${viewType}" placeholder="Label" value="${esc(slot.label || "")}" style="min-height:auto; padding:6px 8px; width:48%;" />
              <input type="text" class="note-input sched-time-input" data-id="${slot.id}" data-view="${viewType}" placeholder="Time" value="${esc(slot.time || "")}" style="min-height:auto; padding:6px 8px; width:48%; text-align:right;" />
            </div>
            <input type="text" class="note-input sched-text-input" data-id="${slot.id}" data-view="${viewType}" placeholder="What will you do?" value="${esc(slot.text || "")}" style="min-height:auto; padding:9px 10px; margin-top:8px; margin-bottom:6px;" />
            <div class="sched-time-row">
              <input type="number" class="note-input sched-mins-input" data-id="${slot.id}" data-view="${viewType}" placeholder="Minutes (optional)" value="${esc(slot.minutes || "")}" style="min-height:auto; padding:9px 10px; width:48%;" />
              <label style="width:48%; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);">
                Remind at
                <input type="time" class="note-input sched-remind-input" data-id="${slot.id}" data-view="${viewType}" value="${slot.remindAt || ""}" style="min-height:auto; padding:6px 8px; flex:1;" />
              </label>
            </div>
            <div style="height:8px;"></div>
            <div style="display:flex; gap:8px;">
              <button class="sched-save-btn" data-id="${slot.id}" data-view="${viewType}">Save</button>
              <button class="sched-remove-btn link-btn" data-id="${slot.id}" data-view="${viewType}" style="width:auto; color:var(--rust); flex:0 0 auto;">Remove</button>
            </div>
            ${isToday && slot.text ? `<button class="sched-done-btn" data-id="${slot.id}" style="margin-top:8px;">Mark done</button>` : ""}
          </div>
        `;
      }).join("")}
      <button id="addSlotBtn" data-view="${viewType}" style="margin-top:4px;">+ Add time slot</button>
    `;
  }


  function renderCalendar() {
    const now = new Date();
    const viewDate = new Date(now.getFullYear(), now.getMonth() + session.monthOffset, 1);
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const monthLabel = viewDate.toLocaleString(undefined, { month: "long", year: "numeric" });

    const completedDays = new Set((saved.history || []).map(e => e.date));
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayIso = todayStr();

    let cells = "";
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell cal-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const done = completedDays.has(iso);
      const isToday = iso === todayIso;
      const isSelected = iso === session.selectedDay;
      cells += `<div class="cal-cell ${done ? "cal-done" : ""} ${isToday ? "cal-today" : ""} ${isSelected ? "cal-selected" : ""}" data-date="${iso}">${d}</div>`;
    }

    return `
      <div class="panel">
        <div class="cal-header">
          <button id="prevMonthBtn" class="cal-nav">‹</button>
          <div class="cal-month">${monthLabel}</div>
          <button id="nextMonthBtn" class="cal-nav">›</button>
        </div>
        <div class="cal-grid cal-weekdays">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div class="cal-grid" id="calGrid">${cells}</div>
      </div>
      ${renderDayDetail()}
    `;
  }

  function renderDayDetail() {
    if (!session.selectedDay) return "";
    const entries = (saved.history || []).filter(e => e.date === session.selectedDay);
    const label = new Date(session.selectedDay + "T00:00:00").toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
    const journalEntry = (saved.journal || {})[session.selectedDay];
    const journalHtml = journalEntry ? `
      <div class="day-detail-journal">
        <div class="sched-time">Journal entry</div>
        <div class="note-text" style="color:var(--ink-light); font-size:14px;">${esc(journalEntry)}</div>
      </div>
    ` : "";

    if (entries.length === 0) {
      return `
        <div class="day-detail">
          <div class="day-detail-label">${esc(label)}</div>
          <div class="day-detail-empty">No tasks completed this day.</div>
          ${journalHtml}
        </div>
      `;
    }
    return `
      <div class="day-detail">
        <div class="day-detail-label">${esc(label)} — ${entries.length} completed</div>
        ${entries.map(e => `
          <div class="report-row">
            <span class="report-time">${esc(e.time)}</span>
            <span class="report-task">${esc(e.text)}</span>
            <span class="report-mins">${e.minutes}m</span>
          </div>
        `).join("")}
        ${journalHtml}
      </div>
    `;
  }

  function renderSummary() {
    const history = saved.history || [];
    const now = new Date();
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - mondayOffset);
    weekStart.setHours(0, 0, 0, 0);
    const monthPrefix = todayStr().slice(0, 7);

    const thisWeek = history.filter(e => new Date(e.date + "T00:00:00") >= weekStart);
    const thisMonth = history.filter(e => e.date.startsWith(monthPrefix));
    const weekMins = thisWeek.reduce((sum, e) => sum + e.minutes, 0);
    const monthMins = thisMonth.reduce((sum, e) => sum + e.minutes, 0);

    return `
      <div class="stats-row" style="margin-bottom:14px;">
        <div class="stat"><div class="num">${thisWeek.length}</div><div class="label">This week (${weekMins}m)</div></div>
        <div class="stat"><div class="num">${thisMonth.length}</div><div class="label">This month (${monthMins}m)</div></div>
      </div>
    `;
  }

  function renderReportList() {
    const history = saved.history || [];
    if (history.length === 0) {
      return `<div class="panel" style="margin-top:14px;"><div class="day-detail-empty">No tasks completed yet.</div></div>`;
    }
    const byDay = {};
    history.forEach(e => {
      byDay[e.date] = byDay[e.date] || [];
      byDay[e.date].push(e);
    });
    const days = Object.keys(byDay).sort().reverse();
    const daySections = days.map(day => `
      <div class="report-day">
        <div class="report-day-label">${esc(day)}</div>
        ${byDay[day].map(e => `
          <div class="report-row">
            <span class="report-time">${esc(e.time)}</span>
            <span class="report-task">${esc(e.text)}</span>
            <span class="report-mins">${e.minutes}m</span>
          </div>
        `).join("")}
      </div>
    `).join("");
    return `
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">${history.length} task${history.length === 1 ? "" : "s"} completed in total</div>
        ${daySections}
      </div>
    `;
  }

  // ---------- Journal ----------
  function renderJournal() {
    const today = todayStr();
    const journal = saved.journal || {};
    const todayEntry = journal[today] || "";
    const pastDates = Object.keys(journal).filter(d => d !== today).sort().reverse();

    const pastEntries = pastDates.length === 0 ? "" : `
      <div class="panel-title" style="margin-top:16px;">Past entries</div>
      ${pastDates.map(d => `
        <div class="journal-past-entry">
          <div class="report-day-label">${esc(d)}</div>
          <div class="note-text" style="color:var(--ink-light); font-size:14px;">${esc(journal[d])}</div>
        </div>
      `).join("")}
    `;

    return `
      <div class="panel">
        <div class="panel-title">Today's journal</div>
        <textarea id="journalInput" class="note-input" style="min-height:100px; background:var(--paper); color:#3A3325;" placeholder="Write anything — how today went, what you're feeling, what you want to remember...">${esc(todayEntry)}</textarea>
        <button id="saveJournalBtn" style="margin-top:10px;">Save entry</button>
        ${session.journalSaved ? `<div class="done-msg" style="margin-top:8px;">✓ Saved — it's stored under today's date, and you'll see it here and on today's calendar day.</div>` : ""}
        ${pastEntries}
      </div>
    `;
  }

  // ---------- Videos ----------
  function renderVideoCard(v, removeIdx) {
    const vid = extractYouTubeId(v.url);
    const key = vid || v.url;
    const isPlaying = session.playingVideo === key;

    if (isPlaying && vid) {
      return `
        <div class="video-card video-card-playing">
          <div class="video-embed-wrap">
            <iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0"
              title="${esc(v.title || "video")}" frameborder="0"
              allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="video-title">${esc(v.title || v.url)}
            <button class="link-btn close-video-btn" data-vid="${key}" style="padding:2px 0;">Close</button>
          </div>
        </div>
      `;
    }

    const thumb = vid
      ? `<img src="https://img.youtube.com/vi/${vid}/maxresdefault.jpg" class="video-thumb" loading="lazy"
           onerror="this.onerror=null; this.src='https://img.youtube.com/vi/${vid}/hqdefault.jpg';" />`
      : `<div class="video-thumb video-thumb-fallback">▶</div>`;
    return `
      <div class="video-card" data-vid="${key}">
        <div class="video-thumb-wrap">
          ${thumb}
          <div class="video-play-badge">▶</div>
          ${removeIdx !== null ? `<button class="remove-video-btn" data-idx="${removeIdx}">✕</button>` : ""}
        </div>
        <div class="video-title">${esc(v.title || v.url)}</div>
      </div>
    `;
  }

  function renderVideos() {
    const custom = saved.videoLinks || [];
    const customGrid = custom.length === 0
      ? `<div class="day-detail-empty">No videos saved yet.</div>`
      : `<div class="video-grid">${custom.map((v, i) => renderVideoCard(v, i)).join("")}</div>`;

    return `
      <div class="panel">
        <div class="panel-title">A little push, whenever you need it</div>
        <div class="video-grid">${DEFAULT_VIDEOS.map(v => renderVideoCard(v, null)).join("")}</div>
      </div>
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">Videos to remember</div>
        ${customGrid}
        <div class="form-row">
          <input type="text" id="newVideoTitle" placeholder="Title (optional)" value="${esc(session.newVideoTitle || "")}" />
          <input type="text" id="newVideoUrl" placeholder="YouTube link" value="${esc(session.newVideoUrl || "")}" />
          <button id="addVideoBtn" style="margin-top:10px;">Save video</button>
        </div>
      </div>
    `;
  }

  // ---------- Manage tasks ----------
  function renderManage() {
    const custom = saved.customTasks || [];
    const rows = custom.length === 0
      ? `<div class="day-detail-empty">No custom tasks yet — add one below.</div>`
      : custom.map((t, i) => `
          <div class="task-row">
            <span class="report-task">${esc(t.text)}</span>
            <span class="report-mins">${t.minutes}m</span>
            <button class="remove-task-btn" data-idx="${i}">✕</button>
          </div>
        `).join("");

    const permLabel = notifPermission === "granted" ? "Enabled ✓"
      : notifPermission === "denied" ? "Blocked (check your browser's site settings)"
      : notifPermission === "unsupported" ? "Not supported in this browser"
      : "Not enabled yet";

    return `
      <div class="panel">
        <div class="panel-title">Reminders</div>
        <div class="day-detail-empty" style="margin-bottom:10px;">
          Status: ${permLabel}. While this tab is open (foreground or background), you'll get a nudge if you haven't
          started by midday, a streak-at-risk alert in the evening, an alert when a focus timer finishes, and alerts
          for any schedule slot you've set a time on.
        </div>
        ${notifPermission !== "granted" && notifPermission !== "unsupported" ? `<button id="enableNotifsBtn">Enable browser notifications</button>` : ""}
      </div>
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">Your custom tasks</div>
        ${rows}
        <div class="form-row">
          <input type="text" id="newTaskText" placeholder="Task description" value="${esc(session.newTaskText || "")}" />
          <input type="number" id="newTaskMinutes" placeholder="Minutes" value="${esc(session.newTaskMinutes || "")}" />
          <button id="addTaskBtn" style="margin-top:10px;">Add task</button>
        </div>
      </div>
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">Danger zone</div>
        <div class="day-detail-empty" style="margin-bottom:10px;">Clears your streak, history, tasks, journal, videos, and reminder from this browser. Can't be undone.</div>
        <button id="resetBtn" class="danger-btn">Reset all progress</button>
      </div>
    `;
  }


  // ---------- Motivation Buddy ----------
  let onboardingBuddy = { gender: "boy", name: "" };

  const BUDDY_MOOD = {

        (n, s) => s.streak >= 2 ? `Day ${s.streak} of showing up. Steady beats flashy, ${n}. ✨` : `Good to have you here, ${n}. Let's get one thing done. ☀️`,
        (n, s) => `Just a normal day — and normal days are how streaks are built, ${n}. 🙂`,
        (n, s) => s.total > 0 ? `${s.total} done so far. Let's make it ${s.total + 1}. ✨` : `Let's start something today, ${n}. ☀️`
      ],
      button: "Let's keep going",
      burst: "☀️ Steady energy unlocked",
      outfit: "hoodie"
    },
    good: {
      label: "Good day",
      emoji: "🔥",
      kicker: "Let's use this energy",
      lines: [
        (n, s) => `YES! ${n} is ready! You've got momentum today — let's make it count! 🔥`,
        (n, s) => s.streak >= 7 ? `${s.streak} days strong and you're still bringing this energy, ${n}?! Let's go. 🔥` : `Feeling good, ${n}? Let's ride it — pick something a little bigger today. 🔥`,
        (n, s) => `This is a great day to get ahead, ${n}. Don't just keep the pace — set it. 🚀`,
        (n, s) => s.best > 0 && s.streak >= s.best ? `${n}, you're matching your best streak ever right now. Let's beat it. 🏆` : `Let's stack another win, ${n}. 🔥`
      ],
      button: "Let's make it count",
      burst: "🔥 Momentum mode!",
      outfit: "energy"
    }
  };

  function buddyMessage(mood, name) {
    const cfg = BUDDY_MOOD[mood];
    const stats = { streak: saved.streak || 0, best: saved.bestStreak || 0, total: saved.totalCompleted || 0 };
    const seed = todayStr() + mood;
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    const line = cfg.lines[h % cfg.lines.length];
    return line(name, stats);
  }

  function buddyName() {
    return (saved && saved.buddy && saved.buddy.name) ? saved.buddy.name : "Buddy";
  }

  function buddyGender() {
    return (saved && saved.buddy && saved.buddy.gender) ? saved.buddy.gender : "boy";
  }

  function buddyMood() {
    return todaysMood() || "okay";
  }

  function buddySvg(style, mood, small = false) {
    const cls = small ? "buddy-mini-art" : "buddy-character";

    const inner = warm ? "#FFE7BE" : "#DFF5F7";

    const ink = "#3A2A1E";

    let eyes, brows, mouth, sparkle = "";
    if (mood === "rough") {
      eyes = `<path d="M44 78q6-4 12 0M64 78q6-4 12 0" fill="none" stroke="${ink}" stroke-width="3.4" stroke-linecap="round"/>`;
      brows = `<path d="M42 70q7-4 12-1M66 69q7-3 12 1" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round" opacity=".5"/>`;
      mouth = `<path d="M52 92q8-2 16 0" fill="none" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`;
    } else if (mood === "good") {

      brows = `<path d="M41 67q8-6 14 0M65 67q8-6 14 0" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>`;
      mouth = `<path d="M48 90q12 12 24 0" fill="none" stroke="${ink}" stroke-width="2.8" stroke-linecap="round"/>`;
      sparkle = `<path d="M96 30l2.4 5.6 6 1.6-6 1.7-2.4 5.6-2.4-5.6-6-1.7 6-1.6Z" fill="${outer}" opacity=".85"/>`;
    } else {

        <path d="M49 46C46 34 49 23 56 17C55 28 56 36 60 42C64 36 65 28 64 17C71 23 74 34 71 46Z" fill="url(#${gradId})"/>
        <path d="M60 42C40 46 31 64 34 82C36 99 46 112 60 112C74 112 84 99 86 82C89 64 80 46 60 42Z" fill="url(#${gradId})"/>
        <path d="M60 56C48 60 42 72 44 84C45 96 52 104 60 104C68 104 75 96 76 84C78 72 72 60 60 56Z" fill="${inner}" opacity=".55"/>

  function buddyStage() {
    const s = saved.streak || 0;
    if (s >= 30) return 4;
    if (s >= 14) return 3;
    if (s >= 7) return 2;
    if (s >= 3) return 1;
    return 0;
  }
  const BUDDY_STAGE_LABEL = ["a new spark", "a steady flame", "a bright flame", "a radiant flame", "a blazing flame"];

  function lastWeekRange() {
    const now = new Date();
    const thisWeekStart = new Date(now);
    thisWeekStart.setDate(now.getDate() - now.getDay());
    const lastWeekStart = new Date(thisWeekStart);
    lastWeekStart.setDate(thisWeekStart.getDate() - 7);
    const lastWeekEnd = new Date(thisWeekStart);
    lastWeekEnd.setDate(thisWeekStart.getDate() - 1);
    return { start: localIso(lastWeekStart), end: localIso(lastWeekEnd), key: localIso(lastWeekStart) };
  }

  function weeklyRecapData() {
    const { start, end } = lastWeekRange();
    const entries = (saved.history || []).filter(h => h.date >= start && h.date <= end);
    const moodCounts = {};
    Object.keys(saved.moodLog || {}).forEach(d => {
      if (d >= start && d <= end) {
        const m = saved.moodLog[d];
        moodCounts[m] = (moodCounts[m] || 0) + 1;
      }
    });
    let topMood = null, topCount = 0;
    Object.keys(moodCounts).forEach(m => { if (moodCounts[m] > topCount) { topMood = m; topCount = moodCounts[m]; } });
    return {
      count: entries.length,
      minutes: entries.reduce((s, h) => s + (h.minutes || 0), 0),
      activeDays: new Set(entries.map(h => h.date)).size,
      topMood
    };
  }

  function shouldShowWeeklyRecap() {
    const { key } = lastWeekRange();
    if (saved.lastRecapShownWeek === key) return false;
    return weeklyRecapData().count > 0;
  }

  function renderWeeklyRecap() {
    if (!shouldShowWeeklyRecap()) return "";
    const data = weeklyRecapData();
    const moodLabel = data.topMood ? (BUDDY_MOOD[data.topMood] ? BUDDY_MOOD[data.topMood].label.toLowerCase() : "steady") : "steady";
    return `
      <div class="panel" style="margin-bottom:14px; border-color:var(--amber);">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
          ${buddySvg(buddyGender(), "good", true)}

            <div class="panel-title" style="margin-bottom:2px;">${esc(buddyName())}'s weekly recap</div>

          <div class="stat"><div class="num">${data.activeDays}</div><div class="label">Active days</div></div>
          <div class="stat"><div class="num">${data.minutes}</div><div class="label">Minutes</div></div>
        </div>
        <div class="note-text" style="margin-bottom:10px;">
          Mostly a ${esc(moodLabel)} kind of week. ${data.activeDays >= 5 ? "That's excellent consistency." : data.activeDays >= 3 ? "Solid showing up." : "Every bit counts — let's build on it this week."}
        </div>
        <button id="dismissRecapBtn" class="link-btn">Got it, thanks ${esc(buddyName())}</button>
      </div>
    `;
  }

  function renderBuddyCard() {

      <div class="panel">

          <div class="buddy-mini-copy">

  function beginBuddyChange() {
    onboardingBuddy = {
      gender: buddyGender(),
      name: buddyName()
    };
    try { delete saved.buddy; } catch (e) {}
    renderOnboardingOnly();
  }

  function renderOnboardingOnly() {
    app.innerHTML = renderBuddyOnboarding();
    wireBuddyOnboarding();
  }

  function wireBuddyOnboarding() {
    document.querySelectorAll("[data-buddy-gender]").forEach(btn => {
      btn.addEventListener("click", () => {
        onboardingBuddy.gender = btn.dataset.buddyGender;
        renderOnboardingOnly();
      });
    });

    const input = document.getElementById("buddyNameInput");
    if (input) {
      input.focus();
      input.addEventListener("input", () => { onboardingBuddy.name = input.value; });
    }

    const create = document.getElementById("createBuddyBtn");
    if (create) create.addEventListener("click", async () => {
      const name = (document.getElementById("buddyNameInput")?.value || "").trim();
      if (!name) {
        const err = document.getElementById("buddyNameError");
        if (err) err.textContent = "Please give your buddy a name 💛";
        return;
      }
      onboardingBuddy.name = name.slice(0, 20);
      saved.buddy = {
        gender: onboardingBuddy.gender === "girl" ? "girl" : "boy",
        name: onboardingBuddy.name,
        createdAt: Date.now(),
        version: 1
      };
      persist();
      if (fbUser) {
        cloudStatus = "syncing";
        await pushToCloud();
      }
      session = newTask();
      render();
      setTimeout(() => notify(`Meet ${buddyName()}! ✨`, `${buddyName()} is ready to cheer you on.`), 250);
    });
  }


  // ---------- Main render ----------
  const TABS = [
    { id: "today", label: "Today", icon: "☀" },
    { id: "schedule", label: "Schedule", icon: "⏰" },
    { id: "calendar", label: "Calendar", icon: "▦" },
    { id: "stats", label: "Stats", icon: "📈" },
    { id: "journal", label: "Journal", icon: "✎" },
    { id: "videos", label: "Videos", icon: "▶" },
    { id: "tasks", label: "Tasks", icon: "☰" },
    { id: "account", label: "Account", icon: "☁" }
  ];

  // ---------- Stats ----------
  function weekStartIso() {
    const now = new Date();
    const startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    return localIso(startOfWeek);
  }
  function last14DaysCounts() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = localIso(d);
      const count = (saved.history || []).filter(h => h.date === iso).length;
      days.push({ date: iso, count });
    }
    return days;
  }
  function weekCompletions() {
    const startIso = weekStartIso();
    return (saved.history || []).filter(h => h.date >= startIso).length;
  }
  function weekMinutes() {
    const startIso = weekStartIso();
    return (saved.history || []).filter(h => h.date >= startIso).reduce((s, h) => s + (h.minutes || 0), 0);
  }
  function activeDaysThisWeek() {
    const startIso = weekStartIso();
    const set = new Set((saved.history || []).filter(h => h.date >= startIso).map(h => h.date));
    return set.size;
  }
  function drawStatsChart() {
    const canvas = document.getElementById("statsChart");
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 600;
    const cssHeight = canvas.clientHeight || 160;
    canvas.width = Math.max(1, Math.round(cssWidth * dpr));
    canvas.height = Math.max(1, Math.round(cssHeight * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);
    const data = last14DaysCounts();
    const max = Math.max(1, ...data.map(d => d.count));
    const barW = cssWidth / data.length;
    data.forEach((d, i) => {
      const barH = (d.count / max) * (cssHeight - 24);
      ctx.fillStyle = d.count > 0 ? "#FF8A3D" : "#3A3050";
      ctx.fillRect(i * barW + barW * 0.15, cssHeight - barH - 18, barW * 0.7, barH || 1);
      ctx.fillStyle = "#A79BBF";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.date.slice(5).replace("-", "/"), i * barW + barW / 2, cssHeight - 6);
    });
  }
  function renderStats() {
    return `
      <div class="panel">
        <div class="panel-title">Last 14 days</div>
        <canvas id="statsChart" style="width:100%; height:160px; display:block;"></canvas>
      </div>
      <div class="panel">
        <div class="panel-title">This week</div>
        <div class="stats-row">
          <div class="stat"><div class="num">${weekCompletions()}</div><div class="label">Tasks done</div></div>
          <div class="stat"><div class="num">${weekMinutes()}</div><div class="label">Minutes</div></div>
          <div class="stat"><div class="num">${activeDaysThisWeek()}</div><div class="label">Active days</div></div>
        </div>
      </div>
    `;
  }

  // ---------- Account / cloud sync ----------
  function renderAccount() {
    const buddyPanel = renderBuddySettings();
    if (!CLOUD_CONFIGURED) {
      return `
        ${buddyPanel}
        <div class="panel" style="margin-top:14px;">
          <div class="panel-title">Cloud sync</div>
          <div class="note-text">Cloud sync isn't set up yet. Add your Firebase project's config to FIREBASE_CONFIG near the top of the script to enable accounts and cross-device sync. Instructions are in a comment right above it.</div>
        </div>
      `;
    }
    if (fbUser) {
      return `
        ${buddyPanel}
        <div class="panel" style="margin-top:14px;">
          <div class="panel-title">Signed in</div>

          <div class="mood-hint" style="margin:10px 0;">${cloudStatusLabel()}</div>
          <button id="signOutBtn" class="danger-btn">Sign out</button>
        </div>
      `;
    }
    return `
      ${buddyPanel}
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">Sign in to sync across devices</div>
        ${cloudError ? `<div class="mood-hint" style="color:var(--rust); margin-bottom:8px;">${cloudError}</div>` : ""}
        <div class="form-row"><input id="authEmail" type="email" placeholder="Email" value="${esc(session.authEmail || "")}"></div>
        <div class="form-row"><input id="authPassword" type="password" placeholder="Password (6+ characters)"></div>
        <button id="signInBtn" style="margin-top:12px;">Sign in — I already have an account</button>
        <button id="signUpBtn" style="margin-top:14px; background:#2E7D5B; color:#fff; border:2px solid #1E5C40;">+ New here? Create an account</button>
        <div class="divider-thin"></div>
        <button id="googleSignInBtn">Continue with Google</button>
        <div class="mood-hint" style="margin-top:12px;">Your progress stays local on this device until you sign in.</div>
      </div>
    `;
  }

  function renderTabContent(opts) {
    switch (activeTab) {
      case "calendar":
        return `
          <div class="tab-grid">
            <div>${renderSummary()}${renderCalendar()}</div>
            <div>${renderReportList()}</div>
          </div>
        `;
      case "schedule":
        return renderSchedule();
      case "stats":
        return renderStats();
      case "journal":
        return renderJournal();
      case "videos":
        return renderVideos();
      case "tasks":
        return renderManage();
      case "account":
        return renderAccount();
      default:
        return `
          ${renderMoodCheck()}
          ${renderWeeklyRecap()}
          ${renderBuddyCard()}
          ${renderMoodGuidance()}
          <div class="tab-grid">

              <div class="quote-card">"${opts.quote || pick(quotePoolForMood(todaysMood()))}"</div>

            </div>

  function render(opts) {
    opts = opts || {};
    lastRenderOpts = opts;
    const today = todayStr();

    if (!saved || !saved.buddy || !saved.buddy.name || !saved.buddy.gender) {
      onboardingBuddy = onboardingBuddy || { gender: "boy", name: "" };
      renderOnboardingOnly();
      return;
    }

    app.innerHTML = `
      <div class="app-shell mood-${todaysMood() || "none"}">
        <div class="app-tabbar ${mobileMenuOpen ? "open" : ""}">
          ${TABS.map(t => `
            <button class="tab-btn ${activeTab === t.id ? "active" : ""}" data-tab="${t.id}">
              <span class="tab-icon">${t.icon}</span>${t.label}
            </button>
          `).join("")}
        </div>
        <div class="menu-backdrop ${mobileMenuOpen ? "open" : ""}" id="menuBackdrop"></div>
        <div class="app-body">
          <div class="app-header">
            <button class="menu-toggle" id="menuToggleBtn">
              <span class="menu-toggle-icon">${mobileMenuOpen ? "✕" : "☰"}</span>
              <span class="menu-toggle-label">${TABS.find(t => t.id === activeTab)?.label || "Menu"}</span>
            </button>
            <div class="eyebrow">Day ${daysBetween(saved.startDate, today) + 1} since you started</div>
            <h1 class="title">Keep Pushing</h1>
            <div class="stats-row">
              <div class="stat"><div class="num">${saved.streak}${saved.streakGrace > 0 ? `<span class="shield-badge" title="${saved.streakGrace} streak shield${saved.streakGrace > 1 ? "s" : ""} — protects one missed day">🛡️${saved.streakGrace}</span>` : ""}</div><div class="label">Streak</div></div>
              <div class="stat"><div class="num">${saved.bestStreak}</div><div class="label">Best</div></div>
              <div class="stat"><div class="num">${saved.totalCompleted}</div><div class="label">Total</div></div>
            </div>
          </div>
          <div class="app-main">${renderTabContent(opts)}</div>
        </div>
      </div>
    `;

    wireEvents(opts);
    if (activeTab === "stats") requestAnimationFrame(drawStatsChart);
  }

  function wireEvents(opts) {
    const q = (id) => document.getElementById(id);
    const rerender = () => render({ quote: opts.quote });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTab = btn.dataset.tab;
        mobileMenuOpen = false;
        rerender();
      });
    });

  // ---------- Cross-tab / cross-write safety ----------
  // Opening the app in a second tab (or a second device via cloud sync)
  // gives that copy its own in-memory `saved`. Without this, whichever
  // tab/device called persist() last would fully overwrite the other's
  // data — silently deleting a task it had just completed. mergeSaved
  // folds both copies together on every write instead of one replacing
  // the other, and streak/total are derived from the merged history
  // rather than trusted as two separately-incremented counters.
  function dedupeBy(list, keyFn) {
    const seen = new Set();
    const out = [];
    (list || []).forEach(item => {
      const k = keyFn(item);
      if (!seen.has(k)) { seen.add(k); out.push(item); }
    });
    return out;
  }

  function deriveStatsFromHistory(state) {
    const dates = Array.from(new Set((state.history || []).map(h => h.date))).sort();
    state.totalCompleted = (state.history || []).length;
    let best = 0, run = 0, prevDate = null;
    dates.forEach(d => {
      run = (prevDate && daysBetween(prevDate, d) === 1) ? run + 1 : 1;
      best = Math.max(best, run);
      prevDate = d;
    });
    const lastDate = dates.length ? dates[dates.length - 1] : null;
    state.lastCompleted = lastDate;
    const today = todayStr();
    const yesterday = yesterdayStr();
    state.bestStreak = Math.max(best, state.bestStreak || 0);

    // Streak shields: one missed day can be bridged instead of resetting
    // the streak, if a shield is available. Bridged gaps are logged so
    // re-running this (e.g. on every save/merge) never double-charges.
    state.streakGrace = typeof state.streakGrace === "number" ? state.streakGrace : 0;
    state.streakGraceLog = state.streakGraceLog || [];

    if (lastDate !== today && lastDate !== yesterday) {
      state.streak = 0;
    } else {
      let count = dates.length ? 1 : 0;
      for (let i = dates.length - 1; i > 0; i--) {
        const gap = daysBetween(dates[i - 1], dates[i]);
        if (gap === 1) { count++; continue; }
        if (gap === 2) {
          const missedDate = localIso(new Date(new Date(dates[i - 1] + "T00:00:00").getTime() + 86400000));
          if (state.streakGraceLog.indexOf(missedDate) !== -1) { count++; continue; }
          if (state.streakGrace > 0) {
            state.streakGrace -= 1;
            state.streakGraceLog.push(missedDate);
            count++;
            continue;
          }
        }
        break;
      }
      state.streak = count;
    }

    if (state.streak > 0 && state.streak % 7 === 0 && (state.streakGraceAwardedAt || 0) < state.streak) {
      state.streakGrace = Math.min(2, (state.streakGrace || 0) + 1);
      state.streakGraceAwardedAt = state.streak;
    }
  }

  function mergeSaved(local, incoming) {
    if (!incoming) return local;
    if (!local) return incoming;
    const merged = Object.assign({}, incoming, local); // local wins for any plain/unhandled field

    // Buddy migration: never erase a buddy because an older cloud record
    // does not yet contain the new buddy field.
    if (local.buddy && local.buddy.name) merged.buddy = local.buddy;
    else if (incoming.buddy && incoming.buddy.name) merged.buddy = incoming.buddy;
    else merged.buddy = null;

    // Streak shields: union the two logs so a shield used on either device
    // is never double-charged after merging, and take the max of counters.
    merged.streakGraceLog = Array.from(new Set([...(incoming.streakGraceLog || []), ...(local.streakGraceLog || [])]));
    merged.streakGrace = Math.max(local.streakGrace || 0, incoming.streakGrace || 0);
    merged.streakGraceAwardedAt = Math.max(local.streakGraceAwardedAt || 0, incoming.streakGraceAwardedAt || 0);

    merged.startDate = (local.startDate && incoming.startDate)
      ? (local.startDate < incoming.startDate ? local.startDate : incoming.startDate)
      : (local.startDate || incoming.startDate);

    merged.history = dedupeBy(
      (incoming.history || []).concat(local.history || []),
      h => `${h.date}|${h.time}|${h.text}|${h.minutes}`
    ).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    merged.customTasks = dedupeBy(
      (incoming.customTasks || []).concat(local.customTasks || []),
      t => `${t.text}|${t.minutes}`
    );

    merged.videoLinks = dedupeBy(
      (incoming.videoLinks || []).concat(local.videoLinks || []),
      v => v.url
    );

    // Day-keyed maps: local's own entries win per key, incoming just fills gaps.
    merged.journal = Object.assign({}, incoming.journal, local.journal);
    merged.moodLog = Object.assign({}, incoming.moodLog, local.moodLog);
    merged.holidayDates = Object.assign({}, incoming.holidayDates, local.holidayDates);
    merged.notifyFlags = Object.assign({}, incoming.notifyFlags, local.notifyFlags);
    merged.schedulePlan = Object.assign({}, incoming.schedulePlan, local.schedulePlan);

    // scheduleLog is one level deeper (date -> slotId -> done) — a shallow
    // merge could drop a slot one tab marked done if the other tab touched
    // the same day, so merge each day's slot flags together too.
    merged.scheduleLog = {};
    new Set([...Object.keys(incoming.scheduleLog || {}), ...Object.keys(local.scheduleLog || {})]).forEach(d => {
      merged.scheduleLog[d] = Object.assign({}, (incoming.scheduleLog || {})[d], (local.scheduleLog || {})[d]);
    });

    deriveStatsFromHistory(merged);
    return merged;
  }

  function persist() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) saved = mergeSaved(saved, JSON.parse(raw));
    } catch (e) { /* on-disk copy missing/corrupt — just write what we have */ }
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { console.error("Save failed", e); }
    scheduleCloudSave();
  }

  // ---------- Reminders & notifications ----------
  let notifPermission = (typeof Notification !== "undefined") ? Notification.permission : "unsupported";

  function showToast(title, body) {
    const layer = document.getElementById("toastLayer");
    if (!layer) return;
    const el = document.createElement("div");
    el.className = "toast";
    const titleEl = document.createElement("div");
    titleEl.className = "toast-title";
    titleEl.textContent = title;
    const bodyEl = document.createElement("div");
    bodyEl.className = "toast-body";
    bodyEl.textContent = body;
    const closeBtn = document.createElement("button");
    closeBtn.className = "toast-close";
    closeBtn.setAttribute("aria-label", "Dismiss");
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => el.remove());
    el.appendChild(closeBtn);
    el.appendChild(titleEl);
    el.appendChild(bodyEl);
    layer.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 9000);
  }

  function notify(title, body) {
    showToast(title, body);
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification(title, { body }); } catch (e) {}
    }
  }

  function requestNotifPermission() {
    if (typeof Notification === "undefined") return;
    Notification.requestPermission().then(p => {
      notifPermission = p;
      rerender();
      if (p === "granted") notify("Reminders on", "You'll hear from this tab while it's open.");
    });
  }

  function getNotifyFlags() {
    saved.notifyFlags = saved.notifyFlags || {};
    const today = todayStr();
    if (!saved.notifyFlags[today]) saved.notifyFlags[today] = { idleNudge: false, streakRisk: false, slotsFired: {} };
    return saved.notifyFlags[today];
  }

  // If the last completed day isn't today or yesterday, the streak is
  // already broken — don't let the header keep showing a stale number
  // until the next time a task happens to be completed.
  function checkStreakDecay() {
    if (!saved) return;
    const today = todayStr();
    const yesterday = yesterdayStr();
    if (saved.streak > 0 && saved.lastCompleted && saved.lastCompleted !== today && saved.lastCompleted !== yesterday) {
      saved.streak = 0;
      persist();
    }
  }

  function runReminderChecks() {
    if (!saved) return;
    checkStreakDecay();
    const flags = getNotifyFlags();
    const now = new Date();
    const hour = now.getHours();
    const today = todayStr();
    const doneToday = (saved.history || []).some(h => h.date === today);

    if (!doneToday && hour >= 11 && !flags.idleNudge) {
      flags.idleNudge = true;
      persist();
      notify("Still time today", pick(quotePoolForMood(todaysMood())));
    }

    if (!doneToday && hour >= 19 && saved.streak > 0 && !flags.streakRisk) {
      flags.streakRisk = true;
      persist();
      notify("Your streak is waiting", `You're on a ${saved.streak}-day streak — one small task keeps it going.`);
    }

    const type = dayType(now);
    const plan = getSchedulePlan(type);
    const nowHM = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    plan.forEach(slot => {
      if (slot.remindAt && slot.remindAt === nowHM && !flags.slotsFired[slot.id]) {
        flags.slotsFired[slot.id] = true;
        persist();
        notify(slot.label || "Scheduled reminder", slot.text || "Time for your planned block.");
      }
    });
  }

  // ---------- Ambient background: a small field of drifting embers ----------
  // The pattern reseeds once a day (so it feels fresh without being distracting)
  // and grows a little denser as totalCompleted climbs, echoing the lamp.
  function initBackground() {
    const canvas = document.getElementById("bgCanvas");
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let w = 0, h = 0;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = canvas.clientWidth || canvas.parentElement.clientWidth;
      h = canvas.clientHeight || canvas.parentElement.clientHeight;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    // day-seeded pseudo-random sequence, tied to the local calendar day so
    // it reseeds at local midnight rather than UTC midnight
    let seed = todayStr().split("-").reduce((n, part) => n * 37 + Number(part), 1);
    function rand() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }

    const completed = (saved && saved.totalCompleted) || 0;
    const count = Math.min(14 + completed, 42);
    const embers = Array.from({ length: count }, () => ({
      x: rand() * 100,
      y: rand() * 100,
      r: 0.6 + rand() * 1.5,
      speed: 0.15 + rand() * 0.3,
      driftAmp: 1.5 + rand() * 2.5,
      phase: rand() * Math.PI * 2,
      warm: rand() > 0.35
    }));

    function frame(t) {
      const mood = todaysMood();
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      if (mood === "rough") {
        grad.addColorStop(0, "#3B2A2E");
        grad.addColorStop(1, "#231A1D");
      } else if (mood === "good") {
        grad.addColorStop(0, "#3A1B0C");
        grad.addColorStop(1, "#1E0D05");
      } else {
        grad.addColorStop(0, "#2C1F42");
        grad.addColorStop(1, "#180F26");
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const speedMul = mood === "rough" ? 0.45 : mood === "good" ? 1.7 : 1;
      const sizeMul = mood === "rough" ? 0.85 : mood === "good" ? 1.35 : 1;
      let warmColor = "#FF9A52", coolColor = "#5FD6C4";
      if (mood === "rough") { warmColor = "#F0A98C"; coolColor = "#E8C79A"; }
      else if (mood === "good") { warmColor = "#FFB23D"; coolColor = "#FF6A2E"; }

      const tt = reduceMotion ? 0 : t * speedMul;
      embers.forEach(p => {
        const yy = ((p.y - tt * 0.0006 * p.speed) % 100 + 100) % 100;
        const xx = ((p.x + Math.sin(tt * 0.0005 + p.phase) * p.driftAmp) % 100 + 100) % 100;
        const twinkle = 0.55 + 0.45 * Math.sin(tt * 0.0018 + p.phase * 2);
        ctx.globalAlpha = 0.25 + 0.45 * twinkle;
        ctx.fillStyle = p.warm ? warmColor : coolColor;
        ctx.beginPath();
        ctx.arc((xx / 100) * w, (yy / 100) * h, p.r * sizeMul, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (!reduceMotion) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function startTimer() {
    if (session.running) return;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    session.running = true;
    render();
    const endAt = Date.now() + session.secondsLeft * 1000;
    timerHandle = setInterval(() => {
      const remaining = Math.round((endAt - Date.now()) / 1000);
      if (remaining <= 0) {
        clearInterval(timerHandle);
        session.secondsLeft = 0;
        session.running = false;
        session.finished = true;
    celebrateCompletion();
        notify("Time's up", `Nice work — "${session.text}" is done.`);
        completeTask();
      } else {
        session.secondsLeft = remaining;
        const timerEl = app.querySelector(".timer");
        if (timerEl) timerEl.textContent = fmtTime(remaining);
      }
    }, 1000);
  }

  function logCompletion(text, minutes) {
    const today = todayStr();
    const timeStr = new Date().toTimeString().slice(0, 5);
    saved.history = saved.history || [];
    saved.history.push({ date: today, time: timeStr, text, minutes });
    const graceLogBefore = (saved.streakGraceLog || []).length;
    deriveStatsFromHistory(saved);
    if ((saved.streakGraceLog || []).length > graceLogBefore) {
      showToast("🛡️ Streak shield used", `You missed a day, but ${buddyName()} covered it — your streak stayed alive.`);
    }
    persist();
  }

  function completeTask() {
    logCompletion(session.text, session.minutes);
    if (window.KPCompanion) window.KPCompanion.celebrate("task");
    render({ quote: pick(quotePoolForMood(todaysMood())) });
  }

  function init() {
    let state = null;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {
      state = null;
    }

    const today = todayStr();
    if (!state) {
      state = { startDate: today, lastCompleted: null, streak: 0, bestStreak: 0, totalCompleted: 0, history: [], personalNote: "", customTasks: [], journal: {}, videoLinks: [] };
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    if (!state.history) state.history = [];
    if (!state.customTasks) state.customTasks = [];
    if (!state.journal) state.journal = {};
    if (!state.videoLinks) state.videoLinks = [];
    if (!state.moodLog) state.moodLog = {};
    if (!state.scheduleLog) state.scheduleLog = {};
    if (!state.holidayDates) state.holidayDates = {};
    if (typeof state.streakGrace !== "number") state.streakGrace = 0;
    if (!state.streakGraceLog) state.streakGraceLog = [];
    if (typeof state.streakGraceAwardedAt !== "number") state.streakGraceAwardedAt = 0;
    if (typeof state.lastRecapShownWeek !== "string") state.lastRecapShownWeek = "";
    if (!state.buddy) state.buddy = null;

    saved = state;
    deriveStatsFromHistory(saved);
    checkStreakDecay();
    session = newTask();
    render();
    initBackground();
    window.addEventListener("storage", (e) => {
      if (e.key !== KEY || !e.newValue || !saved) return;
      try {
        saved = mergeSaved(saved, JSON.parse(e.newValue));
        rerenderGlobal();
      } catch (err) { /* ignore a malformed write from another tab */ }
    });
    setTimeout(runReminderChecks, 4000);
    setInterval(runReminderChecks, 60000);
    initCloud();
  }
  // Public read-only accessors for the floating companion.
  window.KPGetBuddy = function () {
    return (saved && saved.buddy) ? saved.buddy : null;
  };
  window.KPGetMood = function () {
    try { return todaysMood ? todaysMood() : "okay"; } catch (e) { return "okay"; }
  };
  window.KPGetStreak = function () {
    try { return (saved && saved.streak) || 0; } catch (e) { return 0; }
  };

  const _kpOriginalRender = render;
  render = function() {
    const result = _kpOriginalRender.apply(this, arguments);
    if (activeTab === "today") setTimeout(animateNewTask, 0);
    
    return result;
  };


  init();
})();

/* ===== Premium animated Daily Companion ===== */
(function(){
  const stage=document.getElementById("floatingBuddyStage");
  const canvas=document.getElementById("floatingBuddyCanvas");
  const bubble=document.getElementById("floatingBuddyBubble");
  if(!stage||!canvas||!bubble) return;
  const ctx=canvas.getContext("2d");
  const S={x:0,y:0,tx:0,ty:0,vx:0,vy:0,last:0,nextMove:0,nextBlink:0,blink:0,gesture:"idle",gestureT:0,bubbleT:0};

  function hasBuddy(){const b=window.KPGetBuddy&&window.KPGetBuddy();return !!(b&&b.name)}
  function gender(){const b=window.KPGetBuddy&&window.KPGetBuddy();return b&&b.gender==="boy"?"boy":"girl"}
  function name(){const b=window.KPGetBuddy&&window.KPGetBuddy();return b&&b.name?b.name:"Buddy"}
  function mood(){try{return window.KPGetMood?window.KPGetMood():"okay"}catch(e){return"okay"}}
  function streakStage(){try{const s=window.KPGetStreak?window.KPGetStreak():0;return s>=30?4:s>=14?3:s>=7?2:s>=3?1:0}catch(e){return 0}}

  function resize(){
    const d=Math.min(devicePixelRatio||1,2),w=150,h=185;
    canvas.style.width=w+"px";canvas.style.height=h+"px";
    canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);
  }
  function target(){
    const w=innerWidth,h=innerHeight,cw=w<700?115:150,ch=w<700?142:185;
    const lanes=[
      [12,Math.max(72,h-ch-20)],
      [Math.max(12,w-cw-18),Math.max(72,h-ch-20)],
      [Math.max(12,w-cw-22),86],[18,86]
    ];
    const q=lanes[Math.floor(Math.random()*lanes.length)];
    S.tx=Math.max(8,Math.min(w-cw-8,q[0]+Math.random()*32-16));
    S.ty=Math.max(68,Math.min(h-ch-12,q[1]+Math.random()*38-19));
    S.nextMove=performance.now()+6200+Math.random()*4800;
  }
  function say(text,ms=3300){
    if(!hasBuddy())return;
    bubble.textContent=text;bubble.classList.add("show");
    clearTimeout(S.bubbleT);S.bubbleT=setTimeout(()=>bubble.classList.remove("show"),ms);
  }
  function event(kind){
    if(!hasBuddy())return;
    const n=name();
    const messages={
      welcome:`Hi! I'm ${n}. Ready to make today count?`,
      task:`Nice work! One step done. ✨`,
      rough:`It's okay. Let's take one tiny step together.`,
      many:`We've got this. Just one task at a time.`,
      all:`You did it! Today is complete! 🎉`,
      good:`You're doing great. Keep going!`,
      idle:`I'm right here with you. 💛`
    };
    S.gesture=kind==="all"?"celebrate":kind==="task"?"happy":kind==="welcome"?"wave":kind==="rough"?"comfort":"idle";
    S.gestureT=kind==="all"?2600:1800;
    say(messages[kind]||messages.idle,kind==="all"?4200:3200);
    target();
  }
  window.KPCompanion={
    celebrate(kind="task"){event(kind)},
    welcome(){event("welcome")},
    rough(){event("rough")},
    many(){event("many")},
    idle(){event("idle")}
  };

  function ellipse(x,y,rx,ry,fill,rot=0){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=fill;
    ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function line(x1,y1,x2,y2,c,w){
    ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }

  function draw(now){
    const m=mood(),g=gender();
    ctx.clearRect(0,0,150,185);
    ctx.save();ctx.translate(75,102);

    const warm = g !== "girl";
    const outer = warm ? "#FF8A3D" : "#5FB8D9";
    const mid = warm ? "#FFB25E" : "#8FD4E8";
    const inner = warm ? "#FFE7BE" : "#DFF5F7";
    const ember = warm ? "#E8613A" : "#3B7FA0";
    const ink = "#3A2A1E";

    const gesture=S.gesture,active=S.gestureT>0;
    const stageScale = 1 + streakStage() * 0.06;
    const bob = Math.sin(now*.0018)*3 + (active && gesture==="celebrate" ? Math.sin(now*.012)*5 : 0);
    const sway = Math.sin(now*.0013)*2.4;
    const scale = (active && gesture==="celebrate" ? 1.1 : active && gesture==="comfort" ? 0.92 : 1) * stageScale;

    // ground shadow
    ellipse(0,46,26,5,"rgba(0,0,0,.14)");

    ctx.save();
    ctx.translate(sway, bob);
    ctx.scale(scale, scale);

    // soft glow aura
    const grad = ctx.createRadialGradient(0,-4,3,0,-4,48);
    grad.addColorStop(0, outer + "66");
    grad.addColorStop(1, outer + "00");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,-4,48,0,Math.PI*2); ctx.fill();

    // ember base
    ellipse(0,36,13,7,ember+"8C");

    // little flame-tip "ears" for a cuter chibi silhouette
    const tipGrad = ctx.createLinearGradient(0,-28,0,2);
    tipGrad.addColorStop(0, mid); tipGrad.addColorStop(1, outer);
    ctx.fillStyle = tipGrad;
    ctx.beginPath();
    ctx.moveTo(-7,-2); ctx.bezierCurveTo(-9,-12,-7,-19,-3,-24); ctx.bezierCurveTo(-4,-15,-3,-9,0,-2); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(7,-2); ctx.bezierCurveTo(9,-12,7,-19,3,-24); ctx.bezierCurveTo(4,-15,3,-9,0,-2); ctx.closePath(); ctx.fill();

    // round chibi body (gradient)
    const bodyGrad = ctx.createLinearGradient(0,-8,0,42);
    bodyGrad.addColorStop(0, inner);
    bodyGrad.addColorStop(0.55, mid);
    bodyGrad.addColorStop(1, outer);
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(0,-8);
    ctx.bezierCurveTo(-15,-6,-22,8,-20,22);
    ctx.bezierCurveTo(-19,34,-11,42,0,42);
    ctx.bezierCurveTo(11,42,19,34,20,22);
    ctx.bezierCurveTo(22,8,15,-6,0,-8);
    ctx.closePath();
    ctx.fill();

    // inner highlight
    ctx.fillStyle = inner;
    ctx.globalAlpha = .5;
    ctx.beginPath();
    ctx.moveTo(0,2);
    ctx.bezierCurveTo(-8,4,-11,12,-10,20);
    ctx.bezierCurveTo(-9,28,-5,32,0,32);
    ctx.bezierCurveTo(5,32,9,28,10,20);
    ctx.bezierCurveTo(11,12,8,4,0,2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // always a little blush — cuter
    ellipse(-13,20,3.6,2.2,"#FF6A4D42"); ellipse(13,20,3.6,2.2,"#FF6A4D42");

    // face
    if (m === "rough") {
      ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-9,10); ctx.quadraticCurveTo(-6,7,-3,10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3,10); ctx.quadraticCurveTo(6,7,9,10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6,24); ctx.quadraticCurveTo(0,22,6,24); ctx.stroke();
    } else if (m === "good") {
      ellipse(-6,11,3.8,3.8,ink); ellipse(6,11,3.8,3.8,ink);
      ellipse(-4.9,9.3,1.2,1.2,"#fff"); ellipse(7.1,9.3,1.2,1.2,"#fff");
      ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-6,21); ctx.quadraticCurveTo(0,29,6,21); ctx.stroke();
    } else {
      ellipse(-6,11,3.3,3.9,ink); ellipse(6,11,3.3,3.9,ink);
      ellipse(-5,9.5,1,1,"#fff"); ellipse(7,9.5,1,1,"#fff");
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-4,22); ctx.quadraticCurveTo(0,26,4,22); ctx.stroke();
    }
    ctx.restore();

    if (m === "good" || (gesture === "celebrate" && active)) {
      const p = (Math.sin(now*.004)+1)/2;
      ctx.globalAlpha = .35 + .35*p; ctx.fillStyle = "#FFD05B";
      for (let i=0;i<5;i++){ const a=now*.0005+i*1.25, r=42+(i%2)*6;
        ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r-14, 1.8+(i%2), 0, Math.PI*2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    if (gesture === "celebrate" && active) {
      for (let i=0;i<4;i++){ const a=now*.001+i*Math.PI/2;
        line(Math.cos(a)*30, Math.sin(a)*30-16, Math.cos(a)*39, Math.sin(a)*39-16, "#FFD05B", 2); }
    }
    ctx.restore();
  }

  function place(){
    canvas.style.transform=`translate3d(${S.x}px,${S.y}px,0)`;
    const bw=150,right=S.x>innerWidth/2;
    const left=right?S.x-bw+40:S.x+105,top=Math.max(68,S.y+28);
    bubble.style.transform=`translate3d(${Math.max(8,Math.min(innerWidth-bw-8,left))}px,${top}px,0)`;
  }

  function frame(now){
    const dt=Math.min(32,now-(S.last||now));S.last=now;
    if(!hasBuddy()){stage.style.display="none";requestAnimationFrame(frame);return}
    stage.style.display="block";
    if(now>S.nextMove)target();
    const ax=(S.tx-S.x)*.00065*dt,ay=(S.ty-S.y)*.00065*dt;
    S.vx=(S.vx+ax)*.955;S.vy=(S.vy+ay)*.955;S.x+=S.vx*dt;S.y+=S.vy*dt;
    const cw=innerWidth<700?115:150,ch=innerWidth<700?142:185;
    S.x=Math.max(6,Math.min(innerWidth-cw-6,S.x));S.y=Math.max(68,Math.min(innerHeight-ch-12,S.y));
    if(now>S.nextBlink){S.blink=1;S.nextBlink=now+2300+Math.random()*3600}
    if(S.blink>0)S.blink-=dt/120;
    if(S.gestureT>0)S.gestureT-=dt;else S.gesture="idle";
    draw(now);place();requestAnimationFrame(frame);
  }

  function start(){
    resize();S.x=innerWidth<700?innerWidth-130:innerWidth-170;S.y=Math.max(80,innerHeight*.45);
    S.tx=S.x;S.ty=S.y;S.nextMove=performance.now()+1800;S.nextBlink=performance.now()+2400;
    requestAnimationFrame(frame);
    setTimeout(()=>{if(hasBuddy())window.KPCompanion.welcome()},1200);
  }
  window.addEventListener("resize",resize,{passive:true});
  setTimeout(start,700);
})();
</script>

<script id="premium-redesign-runtime">
(function(){
  // Keep the existing app logic intact; this only improves a few visual labels.
  const observer = new MutationObserver(function(){
    document.querySelectorAll('.tab-btn').forEach(function(btn){
      btn.style.fontWeight = '700';
    });
  });
  const app = document.getElementById('app');
  if(app) observer.observe(app,{childList:true,subtree:true});
})();
