<script id="kp-buddy-single-v7-runtime">
(function(){
  const POS="kpBuddySinglePosV7", HIDE="kpBuddySingleHiddenV7", PROFILE="kpBuddySingleProfileV7";
  const canvas=document.getElementById("floatingBuddyCanvas");
  const stage=document.getElementById("floatingBuddyStage");
  if(!canvas||!stage)return;

  // Stop legacy companion behavior from moving or reacting to the canvas.
  try{cancelAnimationFrame(window.buddyAnim)}catch(e){}
  if(window.buddyTimer){clearInterval(window.buddyTimer);window.buddyTimer=null}
  if(window.buddyIdleTimer){clearTimeout(window.buddyIdleTimer);window.buddyIdleTimer=null}
  canvas.onclick=null;
  canvas.onpointerdown=null; canvas.onpointermove=null; canvas.onpointerup=null;

  const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const getProfile=()=>{try{return JSON.parse(localStorage.getItem(PROFILE)||"{}")}catch(e){return{}}};
  const saveProfile=p=>{try{localStorage.setItem(PROFILE,JSON.stringify(p))}catch(e){}};
  const buddyName=()=>{try{const b=window.KPGetBuddy&&window.KPGetBuddy();return b&&b.name?b.name:"Buddy"}catch(e){return"Buddy"}};
  const userName=()=>getProfile().userName||"there";

  function buddyVoiceGender(){
    const p=getProfile();
    return p.voiceGender==="boy" ? "boy" : "girl";
  }

  function pickBuddyVoice(gender){
    const voices=window.speechSynthesis?.getVoices?.()||[];
    if(!voices.length)return null;
    const english=voices.filter(v=>/^en(?:[-_]|$)/i.test(v.lang||""));
    const pool=english.length?english:voices;
    const girlHints=["samantha","karen","victoria","zira","susan","ava","aria","jenny","libby","hazel","siri","female"];
    const boyHints=["daniel","david","mark","george","fred","guy","arthur","tom","alex","male"];
    const hints=gender==="boy"?boyHints:girlHints;
    let best=pool[0], bestScore=-1;
    pool.forEach(v=>{
      const n=(v.name+" "+v.voiceURI).toLowerCase();
      let score=0;
      hints.forEach((h,i)=>{if(n.includes(h))score+=35-i});
      if(/natural|neural|premium|enhanced|online/i.test(n))score+=5;
      if(/^en-(US|GB|AU)/i.test(v.lang||""))score+=2;
      if(score>bestScore){best=v;bestScore=score;}
    });
    return best;
  }

  function speak(t){
    const p=getProfile();
    if(p.voice===false||!window.speechSynthesis)return;
    const gender=buddyVoiceGender();
    const speakNow=()=>{
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(t);
        const v=pickBuddyVoice(gender);
        if(v)u.voice=v;
        u.rate=gender==="girl" ? 1.03 : 1.00;
        u.pitch=gender==="girl" ? 1.42 : 1.26;
        u.volume=.82;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    if((speechSynthesis.getVoices?.()||[]).length) speakNow();
    else setTimeout(speakNow,300);
  }
  function say(t){
    let b=document.getElementById("kpSingleSpeech");
    if(!b){
      b=document.createElement("div");b.id="kpSingleSpeech";
      b.style.cssText="position:fixed;z-index:10090;max-width:280px;padding:9px 12px;border-radius:13px;background:#fff;border:1px solid #e1e6e2;box-shadow:0 8px 24px rgba(31,38,56,.16);font-size:12px;line-height:1.45;display:none";
      document.body.appendChild(b);
    }
    const r=canvas.getBoundingClientRect();
    b.style.left=Math.max(10,Math.min(innerWidth-300,r.left-130))+"px";
    b.style.top=Math.max(55,r.top-55)+"px";
    b.textContent=t;b.style.display="block";
    clearTimeout(window.kpSingleSpeechTimer);
    window.kpSingleSpeechTimer=setTimeout(()=>b.style.display="none",5000);
    speak(t);
  }

  const panel=document.createElement("div");panel.id="kpOneBuddyPanel";document.body.appendChild(panel);
  const edge=document.createElement("button");edge.id="kpBuddyEdgeBubble";edge.title="Open buddy";document.body.appendChild(edge);

  function render(){
    const p=getProfile();
    panel.innerHTML=`<div class="kpob-head"><div><div class="kpob-name">🔥 ${esc(buddyName())}</div><div class="kpob-sub">Your buddy · You: ${esc(p.userName||"not set")}</div></div><button class="kpob-close" data-close>×</button></div>
    <div class="kpob-bubble">Hi${p.userName?", "+esc(p.userName):""}. I'm here when you need me.</div>
    <div class="kpob-grid">
      <button class="kpob-btn primary" data-a="rough">😞 Bad mood</button>
      <button class="kpob-btn" data-a="memory">🧠 Saved help</button>
      <button class="kpob-btn" data-a="focus">⏱ Start focus</button>
      <button class="kpob-btn" data-a="five">🪜 5-minute step</button>
      <button class="kpob-btn" data-a="quote">💬 Quote</button>
      <button class="kpob-btn" data-a="video">🎬 Video</button>
    </div>
    <input class="kpob-input" id="kpSingleUserName" value="${esc(p.userName||"")}" placeholder="Your name">
    <div class="kpob-grid"><button class="kpob-btn" data-a="save">Save my name</button><button class="kpob-btn" data-a="voice">${p.voice===false?"🔇 Voice off":"🔊 Voice on"}</button>
    </div>
    <div style="font-size:11px;font-weight:850;margin-top:10px">Buddy voice</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px">
      <button class="kpob-btn" data-voice="girl" style="${(p.voiceGender||"girl")==="girl"?"background:#718b78!important;color:#fff!important;":""}">👧 Girl</button>
      <button class="kpob-btn" data-voice="boy" style="${(p.voiceGender||"girl")==="boy"?"background:#718b78!important;color:#fff!important;":""}">👦 Boy</button></div>`;
  }
  function open(){render();panel.classList.add("show")}
  function hide(){panel.classList.remove("show");stage.style.display="none";edge.style.display="block";localStorage.setItem(HIDE,"1")}
  function restore(){stage.style.display="block";edge.style.display="none";localStorage.removeItem(HIDE);applyPosition()}
  edge.onclick=restore;

  function memory(mood){
    if(window.KPBuddyMemory?.setMood&&mood)window.KPBuddyMemory.setMood(mood);
    if(window.KPBuddyMemory?.open)window.KPBuddyMemory.open();
    else if(window.KPBuddyMemory?.suggest)window.KPBuddyMemory.suggest();
  }
  function action(a){
    const n=userName();
    if(a==="rough"){say(`It's okay, ${n}. We don't need a perfect day. Let's take one small step.`);memory("rough")}
    if(a==="memory"){say(`I can bring back something you chose to save, ${n}.`);memory()}
    if(a==="quote"){say(`Let's bring back something useful, ${n}.`);memory()}
    if(a==="video"){say(`Here's something you saved for yourself, ${n}.`);memory()}
    if(a==="focus"){document.querySelector('[data-tab="today"]')?.click();setTimeout(()=>document.getElementById("startBtn")?.click(),150);say(`Ready, ${n}? One focused session.`)}
    if(a==="five"){document.querySelector('[data-tab="today"]')?.click();say(`Forget the whole list for now, ${n}. Just five minutes.`)}
    if(a==="save"){const v=document.getElementById("kpSingleUserName")?.value.trim();if(v){let p=getProfile();p.userName=v;saveProfile(p);render();say(`Got it, ${v}. I'm ${buddyName()}.`)}}
    if(a==="voice"){let p=getProfile();p.voice=p.voice===false;saveProfile(p);render();if(p.voice!==false)say(`I'll speak when you interact with me.`)}
  }
  panel.addEventListener("click",e=>{
    if(e.target.closest("[data-close]"))panel.classList.remove("show");
    const a=e.target.closest("[data-a]");if(a)action(a.dataset.a);
    const v=e.target.closest("[data-voice]");
    if(v){
      const p=getProfile();
      p.voiceGender=v.dataset.voice;
      p.voice=true;
      saveProfile(p);
      render();
      say(v.dataset.voice==="girl"?"Okay, I'll use the girl voice.":"Okay, I'll use the boy voice.");
    }
  });

  let dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0,edgeTimer=null,edgeTriggered=false;
  function savePosition(){const r=canvas.getBoundingClientRect();try{localStorage.setItem(POS,JSON.stringify({x:r.left,y:r.top}))}catch(e){}}
  function applyPosition(){
    try{const p=JSON.parse(localStorage.getItem(POS)||"null");if(p)canvas.style.transform=`translate3d(${p.x}px,${p.y}px,0)`}catch(e){}
  }
  function cancelEdge(){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=null}}
  function startEdge(){
    cancelEdge();
    edgeTimer=setTimeout(()=>{if(dragging){edgeTriggered=true;hide();dragging=false}},1100);
  }

  canvas.addEventListener("pointerdown",e=>{
    dragging=true;moved=false;edgeTriggered=false;
    const r=canvas.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    canvas.setPointerCapture?.(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    const r=canvas.getBoundingClientRect(),w=Math.max(70,r.width),h=Math.max(70,r.height);
    const x=Math.max(4,Math.min(innerWidth-w-4,ox+dx)),y=Math.max(55,Math.min(innerHeight-h-4,oy+dy));
    canvas.style.transform=`translate3d(${x}px,${y}px,0)`;
    if(innerWidth-(x+w)<=12)startEdge();else cancelEdge();
  });
  function end(e){
    cancelEdge();
    if(dragging&&!edgeTriggered)savePosition();
    dragging=false;
  }
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);
  canvas.addEventListener("click",()=>{if(moved){moved=false;return}open()});

  window.KPCompanion={
    welcome(){say(`Good morning, ${userName()}. I'm ${buddyName()}. I'm here when you need me.`)},
    celebrate(kind="task"){say(kind==="all"?`You finished today's plan, ${userName()}. Take the win.`:`Nice work, ${userName()}. One step is done.`)},
    rough(){say(`It's okay, ${userName()}. Let's make the next step small.`)},
    many(){say(`One thing at a time, ${userName()}. You don't have to do everything now.`)},
    idle(){say(`I'm here, ${userName()}. Tap me when you want help.`)}
  };

  setTimeout(()=>{
    if(localStorage.getItem(HIDE)==="1"){stage.style.display="none";edge.style.display="block"}
    else{stage.style.display="block";edge.style.display="none";applyPosition()}
  },500);
})();
</script>
