<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Keep Pushing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: #241934;
  }
  .frame-outer {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 0;
    overflow-x: hidden;
  }
  .frame-box { width: 100%; height: 100%; overflow-x: hidden; position: relative; }
  #bgCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #toastLayer {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 8px;
    width: min(90%, 380px); pointer-events: none;
  }
  .toast {
    pointer-events: auto; background: var(--ink-light); color: #FFF6EC;
    border-radius: 8px; padding: 11px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    border-left: 4px solid var(--amber); animation: toastIn 0.25s ease;
  }
  .toast-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; padding-right: 18px; }
  .toast-body { font-size: 12px; color: #DCD2EC; line-height: 1.35; }
  .toast-close {
    float: right; margin: -2px -4px 0 0; background: none; border: none;
    color: #DCD2EC; cursor: pointer; font-size: 13px; padding: 2px 6px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; }
  }
  @media (min-width: 640px) {
    .frame-outer { padding: 32px 16px; align-items: center; }
    .frame-box {
      border: 1px solid #3F6B4A;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      height: 820px;
      max-height: calc(100vh - 64px);
    }
  }
  @media (min-width: 900px) {
    .frame-box { max-width: 820px; }
  }
  @media (min-width: 1200px) {
    .frame-box { max-width: 1040px; }
  }

<style id="buddy-system-styles">
  /* ===== Motivation Buddy system ===== */
  .app-shell {
    transition: background-color .9s ease, color .6s ease;
  }
  .app-shell .app-body,
  .app-shell .app-header,
  .app-shell .panel,
  .app-shell .mood-card,
  .app-shell .task-card,
  .app-shell .quote-card,
  .app-shell .note-card {
    transition: background-color .9s ease, border-color .9s ease, color .6s ease, box-shadow .9s ease;
  }

  .buddy-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 12px 28px rgba(0,0,0,.12);
  }
  .buddy-card::before {
    content: "";
    position: absolute;
    width: 160px;
    height: 160px;
    right: -60px;
    top: -70px;
    border-radius: 50%;
    background: var(--amber);
    opacity: .12;
    animation: buddyAura 3.8s ease-in-out infinite;
  }
  .buddy-row {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  .buddy-art-wrap {
    flex: 0 0 128px;
    min-height: 140px;
    display: grid;
    place-items: center;
    position: relative;
  }
  .buddy-art-wrap::after {
    content: "";
    position: absolute;
    bottom: 4px;
    width: 92px;
    height: 16px;
    border-radius: 50%;
    background: var(--amber);
    opacity: .14;
    filter: blur(5px);
  }
  .buddy-art {
    width: 128px;
    height: 150px;
    position: relative;
    z-index: 2;
    animation: buddyFloat 3s ease-in-out infinite;
  }
  .buddy-art.buddy-rough { animation: buddyComfort 3.2s ease-in-out infinite; }
  .buddy-art.buddy-good { animation: buddyCheer .8s ease-in-out infinite alternate; }
  .buddy-copy { flex: 1; min-width: 0; }
  .buddy-kicker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-faint);
    font-weight: 800;
    margin-bottom: 5px;
  }
  .buddy-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--ink-light);
    margin-bottom: 6px;
  }
  .buddy-message {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .buddy-action {
    width: auto;
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 12px;
  }
  .buddy-mood-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--bg-panel-2);
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  /* Character onboarding */
  .buddy-onboarding {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 22px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,138,61,.18), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(47,182,165,.14), transparent 30%),
      linear-gradient(160deg, #180F26, #2C1F42 55%, #160C22);
    color: #fff;
    overflow: auto;
  }
  .buddy-onboarding-card {
    width: min(560px, 100%);
    padding: 28px;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(20,13,38,.82);
    backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0,0,0,.4);
    animation: buddyOnboardIn .65s cubic-bezier(.2,.8,.2,1) both;
    text-align: center;
  }
  .buddy-sparkle {
    font-size: 28px;
    margin-bottom: 5px;
    animation: buddySparkle 2s ease-in-out infinite;
  }
  .buddy-onboarding h2 {
    margin: 0 0 8px;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: -.02em;
  }
  .buddy-onboarding p {
    margin: 0 auto 20px;
    max-width: 430px;
    color: rgba(255,255,255,.74);
    line-height: 1.55;
  }
  .buddy-gender-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 18px 0;
  }
  .buddy-gender-btn {
    min-height: 160px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: #fff;
    border-radius: 20px;
    padding: 14px;
    cursor: pointer;
    box-shadow: none;
  }
  .buddy-gender-btn:hover { background: rgba(255,255,255,.1); }
  .buddy-gender-btn.active {
    border-color: #FFB23D;
    background: rgba(255,178,61,.13);
    box-shadow: 0 0 0 2px rgba(255,178,61,.22), 0 12px 30px rgba(0,0,0,.18);
  }
  .buddy-gender-emoji { font-size: 58px; display: block; margin-bottom: 8px; }
  .buddy-gender-label { font-size: 16px; font-weight: 800; }
  .buddy-name-input {
    width: 100%;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07);
    color: #fff;
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 16px;
    outline: none;
  }
  .buddy-name-input::placeholder { color: rgba(255,255,255,.42); }
  .buddy-name-input:focus {
    border-color: #FFB23D;
    box-shadow: 0 0 0 3px rgba(255,178,61,.12);
  }
  .buddy-create-btn {
    margin-top: 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, #FF7B62, #FFB23D);
    color: #28130B;
    font-size: 16px;
    padding: 15px;
  }
  .buddy-onboard-preview {
    margin: 12px auto 0;
    min-height: 100px;
    display: grid;
    place-items: center;
  }

  /* Buddy settings */
  .buddy-settings-preview {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-panel-2);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .buddy-mini-art { width: 78px; height: 90px; flex: 0 0 78px; }
  .buddy-mini-copy { flex: 1; }
  .buddy-mini-name { font-weight: 800; font-size: 17px; }
  .buddy-mini-meta { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  /* Mood celebration / transition */
  #buddyMoodBurst {
    position: fixed;
    inset: 0;
    z-index: 10001;
    pointer-events: none;
    display: grid;
    place-items: center;
    opacity: 0;
  }
  #buddyMoodBurst.show { animation: moodBurst .95s ease both; }
  .buddy-burst-card {
    padding: 15px 20px;
    border-radius: 999px;
    background: rgba(25,18,40,.9);
    color: #fff;
    box-shadow: 0 14px 45px rgba(0,0,0,.28);
    text-align: center;
    font-weight: 800;
    font-size: 14px;
  }

  @keyframes buddyFloat {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1deg); }
  }
  @keyframes buddyComfort {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-3px) rotate(2deg); }
  }
  @keyframes buddyCheer {
    from { transform: translateY(0) rotate(-3deg) scale(1); }
    to { transform: translateY(-8px) rotate(3deg) scale(1.04); }
  }
  @keyframes buddyAura {
    0%,100% { transform: scale(.92); opacity: .08; }
    50% { transform: scale(1.12); opacity: .18; }
  }
  @keyframes buddyOnboardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes buddySparkle {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.15) rotate(6deg); }
  }
  @keyframes moodBurst {
    0% { opacity: 0; transform: scale(.82); }
    18% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.06); }
  }

  @media (max-width: 520px) {
    .buddy-row { align-items: flex-start; }
    .buddy-art-wrap { flex-basis: 100px; }
    .buddy-art { width: 100px; height: 124px; }
    .buddy-name { font-size: 19px; }
    .buddy-message { font-size: 13px; }
    .buddy-onboarding-card { padding: 22px 18px; }
    .buddy-gender-btn { min-height: 135px; }
    .buddy-gender-emoji { font-size: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .buddy-art, .buddy-card::before, .buddy-sparkle,
    .buddy-onboarding-card, #buddyMoodBurst.show {
      animation: none !important;
    }
    .app-shell .app-body, .app-shell .app-header, .app-shell .panel,
    .app-shell .mood-card, .app-shell .task-card, .app-shell .quote-card,
    .app-shell .note-card { transition: none !important; }
  }
</style>
</style>

  .buddy-cloud-note{margin-top:10px;font-size:12px;line-height:1.45;color:rgba(255,255,255,.62)}

<style id="buddy-floating-style">
#buddyFloating{position:fixed;right:18px;bottom:82px;z-index:9000;display:none;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--bg-panel);box-shadow:0 10px 26px rgba(0,0,0,.18);cursor:pointer;align-items:center;justify-content:center;overflow:hidden;animation:buddyFloatButton 2.8s ease-in-out infinite}
#buddyFloating svg{width:58px;height:70px}
@keyframes buddyFloatButton{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>

<body>
<div class="frame-outer"><div class="frame-box">
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div id="app"></div>
<div id="toastLayer" aria-live="polite"></div>
<div id="kpCelebration" aria-hidden="true"></div>
<div id="buddyMoodBurst" aria-hidden="true"></div>
<div id="buddyFloating" aria-label="Open your Motivation Buddy"></div>
<style id="enhanced-animations">
  /* === Keep Pushing — enhanced motion layer === */
  @keyframes kpFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes kpFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes kpPop {
    0% { opacity: 0; transform: scale(.86); }
    70% { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes kpPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  @keyframes kpFlame {
    0%, 100% { transform: rotate(-2deg) scaleY(1); transform-origin: 70px 76px; }
    50% { transform: rotate(2deg) scaleY(1.08); transform-origin: 70px 76px; }
  }
  @keyframes kpSpark {
    0% { opacity: 0; transform: translateY(8px) scale(.5); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px) scale(1.15); }
  }
  @keyframes kpCheck {
    0% { opacity: 0; transform: scale(.5) rotate(-8deg); }
    70% { transform: scale(1.12) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes kpNumber {
    0% { opacity: .2; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes kpConfetti {
    0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(720deg); }
  }

  /* Smooth page/tab content entrance */
  #app .content { animation: kpFadeIn .32s ease both; }
  #app .panel, #app .task-card, #app .mood-card, #app .note-card,
  #app .quote-card, #app .sched-block, #app .stat {
    animation: kpFadeUp .36s ease both;
  }

  /* Interactive polish */
  #app button:not(:disabled) {
    transition: transform .16s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
  }
  #app button:not(:disabled):hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(0,0,0,.12);
  }
  #app button:not(:disabled):active {
    transform: translateY(1px) scale(.985);
  }
  .tab-btn { transition: background .2s ease, color .2s ease, transform .16s ease; }
  .tab-btn:hover { transform: translateX(2px); }
  .video-card { transition: transform .2s ease, box-shadow .2s ease; }
  .video-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.14); }

  /* Lamp flame */
  .lamp-wrap svg .kp-flame {
    animation: kpFlame 1.25s ease-in-out infinite;
  }
  .lamp-wrap svg .kp-glow {
    animation: kpPulse 2.4s ease-in-out infinite;
    transform-origin: 70px 70px;
  }

  /* Completion state */
  .kp-completed {
    animation: kpPop .42s cubic-bezier(.2,.8,.2,1) both;
  }
  .done-msg {
    animation: kpCheck .45s cubic-bezier(.2,.8,.2,1) both;
  }
  .kp-stat-number {
    display: inline-block;
    animation: kpNumber .35s ease both;
  }

  /* Final timer countdown */
  .kp-timer-final {
    animation: kpPulse .65s ease-in-out infinite;
  }

  /* Celebration overlay */
  #kpCelebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .kp-confetti-piece {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 7px;
    height: 12px;
    border-radius: 2px;
    background: var(--kp-confetti, var(--amber));
    animation: kpConfetti .85s cubic-bezier(.15,.75,.25,1) forwards;
  }
  .kp-celebrate-badge {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--bg-panel);
    color: var(--ink-light);
    border: 1px solid var(--line);
    box-shadow: 0 12px 34px rgba(0,0,0,.2);
    font-weight: 800;
    animation: kpPop .45s ease both;
  }

  @media (prefers-reduced-motion: reduce) {
    #app .content, #app .panel, #app .task-card, #app .mood-card,
    #app .note-card, #app .quote-card, #app .sched-block, #app .stat,
    .lamp-wrap svg .kp-flame, .lamp-wrap svg .kp-glow, .kp-completed,
    .done-msg, .kp-stat-number, .kp-timer-final, .kp-confetti-piece,
    .kp-celebrate-badge {
      animation: none !important;
    }
    #app button:not(:disabled), .tab-btn, .video-card {
      transition: none !important;
    }
  }
</style>
<style>
  :root {
    --bg-deep: #241934;
    --bg-panel: #FFFFFF;
    --bg-panel-2: #F3ECFB;
    --paper: #FFFBEF;
    --paper-line: #E6DCC3;
    --ink-light: #241934;
    --ink-soft: #6B5C82;
    --ink-faint: #A79BBF;
    --amber: #FF8A3D;
    --amber-dim: #E06A1F;
    --teal: #2FB6A5;
    --rust: #E14F63;
    --line: #E4DCF2;
  }
  /* Mood themes — scoped to .app-shell so every tab/panel picks up the
     right palette via CSS custom-property inheritance, not just Today.
     Chosen with basic color psychology in mind:
     - rough: warm, soft, low-contrast tones (comfort/safety, not stimulating)
     - okay: the app's normal balanced palette
     - good: bold, saturated, high-energy warm tones (momentum/celebration) */
  .app-shell.mood-rough {
    --bg-deep: #3B2A2E;
    --bg-panel-2: #FBEDE4;
    --paper: #FFF6EE;
    --amber: #E8927C;
    --amber-dim: #D97A61;
    --teal: #D9B171;
    --rust: #C97A6A;
    --line: #F0DCD0;
  }
  .app-shell.mood-okay {
    --bg-deep: #241934;
    --amber: #FF8A3D;
    --amber-dim: #E06A1F;
    --teal: #2FB6A5;
  }
  .app-shell.mood-good {
    --bg-deep: #341409;
    --bg-panel-2: #FFEFD9;
    --amber: #FF5A1F;
    --amber-dim: #E8430A;
    --teal: #FFC93D;
    --rust: #FF3355;
    --line: #FFE0B8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-deep); }

  #app {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: transparent;
    color: var(--ink-light);
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  .app-body { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .app-header {
    flex: 0 0 auto;
    padding: 14px 18px 10px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .app-header .title { font-size: 20px; margin: 2px 0 6px; }
  .app-header .stats-row { gap: 8px; }
  .app-header .stat { padding: 8px 6px; }
  .app-header .stat .num { font-size: 18px; }
  .app-main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 18px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .tab-grid { display: block; }
  .app-shell { display: flex; flex-direction: column; height: 100%; overflow-x: hidden; width: 100%; position: relative; }
  .app-tabbar {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 0; left: 0; right: 0;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line);
    max-height: 0;
    overflow: hidden;
    z-index: 50;
    transition: max-height 0.18s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .app-tabbar.open { max-height: 80vh; overflow-y: auto; }
  .menu-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20, 14, 30, 0.5);
    z-index: 40;
  }
  .menu-backdrop.open { display: block; }
  .menu-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 12px;
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-light);
    text-transform: none;
    letter-spacing: normal;
  }
  .menu-toggle-icon { font-size: 15px; }
  .tab-btn {
    background: none;
    border-radius: 0;
    padding: 13px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-light);
    text-transform: none;
    letter-spacing: normal;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .tab-btn .tab-icon { display: inline; font-size: 16px; }
  .tab-btn.active { color: var(--amber); background: var(--bg-panel-2); }
  .tab-btn:active { transform: none; background: var(--bg-panel-2); }

  @media (min-width: 720px) {
    .app-shell { flex-direction: row; }
    .menu-toggle { display: none; }
    .menu-backdrop { display: none !important; }
    .app-tabbar {
      display: flex;
      position: static;
      max-height: none;
      overflow: visible;
      box-shadow: none;
      flex: 0 0 150px;
      flex-direction: column;
      border-bottom: none;
      border-right: 1px solid var(--line);
      padding: 18px 0;
      justify-content: flex-start;

      cloudStatus = "synced";
    } catch (e) {
      console.error(e);
      cloudStatus = "error";
      cloudError = "Couldn't save to cloud.";
    }
  }

  function scheduleCloudSave() {
    if (!fbUser) return;
    cloudStatus = "syncing";
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(() => { pushToCloud().then(rerenderGlobal); }, 1200);
  }

  function friendlyAuthError(e) {
    const code = (e && e.code) || "";
    if (code.includes("email-already-in-use")) return "That email already has an account — try signing in instead.";
    if (code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect email or password.";
    if (code.includes("weak-password")) return "Password should be at least 6 characters.";
    if (code.includes("user-not-found")) return "No account found with that email.";
    if (code.includes("invalid-email")) return "That doesn't look like a valid email.";
    if (code.includes("popup-closed-by-user")) return "";
    return "Something went wrong. Please try again.";
  }

  async function cloudSignUp(email, pw) {
    cloudError = "";
    if (!email || !pw) { cloudError = "Enter an email and password."; rerenderGlobal(); return; }
    try { await AuthLib.createUserWithEmailAndPassword(fbAuth, email, pw); }
    catch (e) { cloudError = friendlyAuthError(e); rerenderGlobal(); }
  }

  async function cloudSignIn(email, pw) {
    cloudError = "";
    if (!email || !pw) { cloudError = "Enter an email and password."; rerenderGlobal(); return; }
    try { await AuthLib.signInWithEmailAndPassword(fbAuth, email, pw); }
    catch (e) { cloudError = friendlyAuthError(e); rerenderGlobal(); }
  }

  async function cloudSignInGoogle() {
    cloudError = "";
    try {
      const provider = new AuthLib.GoogleAuthProvider();
      await AuthLib.signInWithPopup(fbAuth, provider);
    } catch (e) { cloudError = friendlyAuthError(e); rerenderGlobal(); }
  }

  async function cloudSignOut() {
    if (AuthLib && fbAuth) await AuthLib.signOut(fbAuth);
    fbUser = null;
    cloudStatus = "signed-out";
    rerenderGlobal();
  }

  function cloudStatusLabel() {
    if (cloudStatus === "syncing") return "Syncing…";
    if (cloudStatus === "synced") return "✓ Synced to cloud";
    if (cloudStatus === "error") return cloudError || "Sync error";
    return "";
  }

  function allTasks() {
    return TASKS.concat(saved.customTasks || []);
  }

  const MOOD_CHECKIN_EVERY = 3; // ask again after this many completed tasks

  function todaysMood() {
    return (saved.moodLog || {})[todayStr()] || null;
  }

  function setTodaysMood(mood) {
    saved.moodLog = saved.moodLog || {};
    saved.moodLog[todayStr()] = mood;
    saved.moodSetAtCount = saved.totalCompleted || 0;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
    scheduleCloudSave();
  }

  function moodNeedsCheckin() {
    if (!todaysMood()) return false;
    const base = saved.moodSetAtCount ?? saved.totalCompleted ?? 0;
    return (saved.totalCompleted || 0) - base >= MOOD_CHECKIN_EVERY;
  }

  function poolForMood() {
    const pool = allTasks();
    const mood = todaysMood();
    if (mood === "rough") {
      const easy = pool.filter(t => t.minutes <= 3);
      return easy.length ? easy : pool;
    }
    if (mood === "okay") {
      const moderate = pool.filter(t => t.minutes <= 15);
      return moderate.length ? moderate : pool;
    }
    return pool;
  }

  function extractYouTubeId(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    return m ? m[1] : null;
  }

  function newTask() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    const pool = poolForMood();
    const t = pool[Math.floor(Math.random() * pool.length)];
    return {
      text: t.text, minutes: t.minutes, secondsLeft: t.minutes * 60,
      running: false, finished: false,
      editingNote: false, monthOffset: 0, selectedDay: null,
      newTaskText: "", newTaskMinutes: "", newVideoTitle: "", newVideoUrl: "",
      playingVideo: null
    };
  }

  // ---------- Enhanced motion helpers ----------
  function celebrateCompletion() {
    const layer = document.getElementById("kpCelebration");
    if (!layer || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    layer.innerHTML = `<div class="kp-celebrate-badge">✓ ${esc(buddyName())} says: You did it! ✨</div>`;
    const pieces = 22;
    for (let i = 0; i < pieces; i++) {
      const p = document.createElement("span");
      p.className = "kp-confetti-piece";
      const angle = (Math.PI * 2 * i / pieces) + (Math.random() - .5) * .5;
      const distance = 70 + Math.random() * 150;
      p.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
      p.style.setProperty("--dy", `${Math.sin(angle) * distance - 35}px`);
      p.style.setProperty("--kp-confetti", ["var(--amber)", "var(--teal)", "var(--rust)"][i % 3]);
      p.style.marginLeft = `${(Math.random() - .5) * 16}px`;
      p.style.marginTop = `${(Math.random() - .5) * 10}px`;
      layer.appendChild(p);
    }
    setTimeout(() => { layer.innerHTML = ""; }, 1000);
  }

  // ---------- Whole-day schedule (weekday / weekend / holiday plans, any number of slots) ----------
  function makeSlot(overrides) {
    return Object.assign({
      id: "s" + Math.random().toString(36).slice(2, 9),
      label: "", time: "", text: "", minutes: "", remindAt: ""
    }, overrides || {});
  }

  const DEFAULT_PLAN_TEMPLATES = {
    weekday: [
      { label: "Early Morning", time: "6–9 AM" },
      { label: "Morning", time: "9 AM–12 PM" },
      { label: "Midday", time: "12–2 PM" },
      { label: "Afternoon", time: "2–5 PM" },
      { label: "Evening", time: "5–8 PM" },
      { label: "Night", time: "8–10 PM" }
    ],
    weekend: [
      { label: "Early Morning", time: "7–10 AM" },
      { label: "Morning", time: "10 AM–1 PM" },
      { label: "Afternoon", time: "1–5 PM" },
      { label: "Evening", time: "5–9 PM" }
    ],
    holiday: [
      { label: "Slow start", time: "Morning" },
      { label: "Something for you", time: "Midday" },
      { label: "One small task", time: "Afternoon" },
      { label: "Rest & recharge", time: "Evening" }
    ]
  };

  const PLAN_LABELS = { weekday: "Weekday", weekend: "Weekend", holiday: "Holiday" };

  function dayType(d) {
    const iso = localIso(d);
    if ((saved.holidayDates || {})[iso]) return "holiday";
    const day = d.getDay();
    return (day === 0 || day === 6) ? "weekend" : "weekday";
  }

  function getSchedulePlan(type) {
    saved.schedulePlan = saved.schedulePlan || {};
    const existing = saved.schedulePlan[type];
    if (Array.isArray(existing)) return existing;

    // migrate the old fixed-key format if present, otherwise seed sensible defaults
    let slots;
    if (existing && typeof existing === "object") {
      slots = Object.keys(existing).map(k => makeSlot({
        label: k, time: existing[k].time, text: existing[k].text, minutes: existing[k].minutes
      }));
    } else {
      slots = (DEFAULT_PLAN_TEMPLATES[type] || DEFAULT_PLAN_TEMPLATES.weekday).map(s => makeSlot(s));
    }
    saved.schedulePlan[type] = slots;
    persist();
    return slots;
  }

  function getTodayDoneMap() {
    saved.scheduleLog = saved.scheduleLog || {};
    const today = todayStr();
    if (!saved.scheduleLog[today]) saved.scheduleLog[today] = {};
    return saved.scheduleLog[today];
  }

  function isTodayMarkedHoliday() {
    return !!((saved.holidayDates || {})[todayStr()]);
  }

  function toggleTodayHoliday() {
    saved.holidayDates = saved.holidayDates || {};
    const today = todayStr();
    if (saved.holidayDates[today]) delete saved.holidayDates[today];
    else saved.holidayDates[today] = true;
    persist();
  }

              <input type="text" class="note-input sched-time-input" data-id="${slot.id}" data-view="${viewType}" placeholder="Time" value="${esc(slot.time || "")}" style="min-height:auto; padding:6px 8px; width:48%; text-align:right;" />

            <input type="text" class="note-input sched-text-input" data-id="${slot.id}" data-view="${viewType}" placeholder="What will you do?" value="${esc(slot.text || "")}" style="min-height:auto; padding:9px 10px; margin-top:8px; margin-bottom:6px;" />

      <button id="addSlotBtn" data-view="${viewType}" style="margin-top:4px;">+ Add time slot</button>
    `;
  }


  function renderCalendar() {
    const now = new Date();
    const viewDate = new Date(now.getFullYear(), now.getMonth() + session.monthOffset, 1);
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const monthLabel = viewDate.toLocaleString(undefined, { month: "long", year: "numeric" });

    const completedDays = new Set((saved.history || []).map(e => e.date));
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayIso = todayStr();

    let cells = "";
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell cal-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const done = completedDays.has(iso);
      const isToday = iso === todayIso;
      const isSelected = iso === session.selectedDay;
      cells += `<div class="cal-cell ${done ? "cal-done" : ""} ${isToday ? "cal-today" : ""} ${isSelected ? "cal-selected" : ""}" data-date="${iso}">${d}</div>`;
    }

    return `
      <div class="panel">
        <div class="cal-header">
          <button id="prevMonthBtn" class="cal-nav">‹</button>

  function renderDayDetail() {
    if (!session.selectedDay) return "";
    const entries = (saved.history || []).filter(e => e.date === session.selectedDay);
    const label = new Date(session.selectedDay + "T00:00:00").toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    });
    const journalEntry = (saved.journal || {})[session.selectedDay];
    const journalHtml = journalEntry ? `
      <div class="day-detail-journal">
        <div class="sched-time">Journal entry</div>
        <div class="note-text" style="color:var(--ink-light); font-size:14px;">${esc(journalEntry)}</div>
      </div>
    ` : "";

    if (entries.length === 0) {
      return `
        <div class="day-detail">
          <div class="day-detail-label">${esc(label)}</div>
          <div class="day-detail-empty">No tasks completed this day.</div>
          ${journalHtml}
        </div>
      `;
    }
    return `
      <div class="day-detail">
        <div class="day-detail-label">${esc(label)} — ${entries.length} completed</div>
        ${entries.map(e => `
          <div class="report-row">
            <span class="report-time">${esc(e.time)}</span>
            <span class="report-task">${esc(e.text)}</span>
            <span class="report-mins">${e.minutes}m</span>
          </div>
        `).join("")}
        ${journalHtml}
      </div>
    `;
  }

  function renderSummary() {
    const history = saved.history || [];
    const now = new Date();
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - mondayOffset);
    weekStart.setHours(0, 0, 0, 0);
    const monthPrefix = todayStr().slice(0, 7);

    const thisWeek = history.filter(e => new Date(e.date + "T00:00:00") >= weekStart);
    const thisMonth = history.filter(e => e.date.startsWith(monthPrefix));
    const weekMins = thisWeek.reduce((sum, e) => sum + e.minutes, 0);
    const monthMins = thisMonth.reduce((sum, e) => sum + e.minutes, 0);

    return `
      <div class="stats-row" style="margin-bottom:14px;">
        <div class="stat"><div class="num">${thisWeek.length}</div><div class="label">This week (${weekMins}m)</div></div>
        <div class="stat"><div class="num">${thisMonth.length}</div><div class="label">This month (${monthMins}m)</div></div>
      </div>
    `;
  }

  function renderReportList() {
    const history = saved.history || [];
    if (history.length === 0) {
      return `<div class="panel" style="margin-top:14px;"><div class="day-detail-empty">No tasks completed yet.</div></div>`;
    }
    const byDay = {};
    history.forEach(e => {
      byDay[e.date] = byDay[e.date] || [];
      byDay[e.date].push(e);
    });
    const days = Object.keys(byDay).sort().reverse();
    const daySections = days.map(day => `
      <div class="report-day">
        <div class="report-day-label">${esc(day)}</div>
        ${byDay[day].map(e => `
          <div class="report-row">
            <span class="report-time">${esc(e.time)}</span>
            <span class="report-task">${esc(e.text)}</span>
            <span class="report-mins">${e.minutes}m</span>
          </div>
        `).join("")}
      </div>
    `).join("");
    return `
      <div class="panel" style="margin-top:14px;">
        <div class="panel-title">${history.length} task${history.length === 1 ? "" : "s"} completed in total</div>

  // ---------- Stats ----------
  function weekStartIso() {
    const now = new Date();
    const startOfWeek = new Date(now);
    startOfWeek.setDate(now.getDate() - now.getDay());
    return localIso(startOfWeek);
  }
  function last14DaysCounts() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = localIso(d);
      const count = (saved.history || []).filter(h => h.date === iso).length;
      days.push({ date: iso, count });
    }
    return days;
  }
  function weekCompletions() {
    const startIso = weekStartIso();
    return (saved.history || []).filter(h => h.date >= startIso).length;
  }
  function weekMinutes() {
    const startIso = weekStartIso();
    return (saved.history || []).filter(h => h.date >= startIso).reduce((s, h) => s + (h.minutes || 0), 0);
  }
  function activeDaysThisWeek() {
    const startIso = weekStartIso();
    const set = new Set((saved.history || []).filter(h => h.date >= startIso).map(h => h.date));
    return set.size;
  }
  function drawStatsChart() {
    const canvas = document.getElementById("statsChart");
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 600;
    const cssHeight = canvas.clientHeight || 160;
    canvas.width = Math.max(1, Math.round(cssWidth * dpr));
    canvas.height = Math.max(1, Math.round(cssHeight * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);
    const data = last14DaysCounts();
    const max = Math.max(1, ...data.map(d => d.count));
    const barW = cssWidth / data.length;
    data.forEach((d, i) => {
      const barH = (d.count / max) * (cssHeight - 24);
      ctx.fillStyle = d.count > 0 ? "#FF8A3D" : "#3A3050";
      ctx.fillRect(i * barW + barW * 0.15, cssHeight - barH - 18, barW * 0.7, barH || 1);
      ctx.fillStyle = "#A79BBF";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.date.slice(5).replace("-", "/"), i * barW + barW / 2, cssHeight - 6);
    });
  }

  // ---------- Cross-tab / cross-write safety ----------
  // Opening the app in a second tab (or a second device via cloud sync)
  // gives that copy its own in-memory `saved`. Without this, whichever
  // tab/device called persist() last would fully overwrite the other's
  // data — silently deleting a task it had just completed. mergeSaved
  // folds both copies together on every write instead of one replacing
  // the other, and streak/total are derived from the merged history
  // rather than trusted as two separately-incremented counters.
  function dedupeBy(list, keyFn) {
    const seen = new Set();
    const out = [];
    (list || []).forEach(item => {
      const k = keyFn(item);
      if (!seen.has(k)) { seen.add(k); out.push(item); }
    });
    return out;
  }

  function deriveStatsFromHistory(state) {
    const dates = Array.from(new Set((state.history || []).map(h => h.date))).sort();
    state.totalCompleted = (state.history || []).length;
    let best = 0, run = 0, prevDate = null;
    dates.forEach(d => {
      run = (prevDate && daysBetween(prevDate, d) === 1) ? run + 1 : 1;
      best = Math.max(best, run);
      prevDate = d;
    });
    const lastDate = dates.length ? dates[dates.length - 1] : null;
    state.lastCompleted = lastDate;
    const today = todayStr();
    const yesterday = yesterdayStr();
    state.streak = (lastDate === today || lastDate === yesterday) ? run : 0;
    state.bestStreak = Math.max(best, state.bestStreak || 0);
  }

  function mergeSaved(local, incoming) {
    if (!incoming) return local;
    if (!local) return incoming;
    const merged = Object.assign({}, incoming, local); // local wins for any plain/unhandled field

    // Buddy migration: never erase a buddy because an older cloud record
    // does not yet contain the new buddy field.
    if (local.buddy && local.buddy.name) merged.buddy = local.buddy;
    else if (incoming.buddy && incoming.buddy.name) merged.buddy = incoming.buddy;
    else merged.buddy = null;

    merged.startDate = (local.startDate && incoming.startDate)
      ? (local.startDate < incoming.startDate ? local.startDate : incoming.startDate)
      : (local.startDate || incoming.startDate);

    merged.history = dedupeBy(
      (incoming.history || []).concat(local.history || []),
      h => `${h.date}|${h.time}|${h.text}|${h.minutes}`
    ).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    merged.customTasks = dedupeBy(
      (incoming.customTasks || []).concat(local.customTasks || []),
      t => `${t.text}|${t.minutes}`
    );

    merged.videoLinks = dedupeBy(
      (incoming.videoLinks || []).concat(local.videoLinks || []),
      v => v.url
    );

    // Day-keyed maps: local's own entries win per key, incoming just fills gaps.
    merged.journal = Object.assign({}, incoming.journal, local.journal);
    merged.moodLog = Object.assign({}, incoming.moodLog, local.moodLog);
    merged.holidayDates = Object.assign({}, incoming.holidayDates, local.holidayDates);
    merged.notifyFlags = Object.assign({}, incoming.notifyFlags, local.notifyFlags);
    merged.schedulePlan = Object.assign({}, incoming.schedulePlan, local.schedulePlan);

    // scheduleLog is one level deeper (date -> slotId -> done) — a shallow
    // merge could drop a slot one tab marked done if the other tab touched
    // the same day, so merge each day's slot flags together too.
    merged.scheduleLog = {};
    new Set([...Object.keys(incoming.scheduleLog || {}), ...Object.keys(local.scheduleLog || {})]).forEach(d => {
      merged.scheduleLog[d] = Object.assign({}, (incoming.scheduleLog || {})[d], (local.scheduleLog || {})[d]);
    });

    deriveStatsFromHistory(merged);
    return merged;
  }

  function persist() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) saved = mergeSaved(saved, JSON.parse(raw));
    } catch (e) { /* on-disk copy missing/corrupt — just write what we have */ }
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) { console.error("Save failed", e); }
    scheduleCloudSave();
  }

  // ---------- Reminders & notifications ----------
  let notifPermission = (typeof Notification !== "undefined") ? Notification.permission : "unsupported";

  function showToast(title, body) {
    const layer = document.getElementById("toastLayer");
    if (!layer) return;
    const el = document.createElement("div");
    el.className = "toast";
    const titleEl = document.createElement("div");
    titleEl.className = "toast-title";
    titleEl.textContent = title;
    const bodyEl = document.createElement("div");
    bodyEl.className = "toast-body";
    bodyEl.textContent = body;
    const closeBtn = document.createElement("button");
    closeBtn.className = "toast-close";
    closeBtn.setAttribute("aria-label", "Dismiss");
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => el.remove());
    el.appendChild(closeBtn);
    el.appendChild(titleEl);
    el.appendChild(bodyEl);
    layer.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 9000);
  }

  function notify(title, body) {
    showToast(title, body);
    if (typeof Notification !== "undefined" && Notification.permission === "granted") {
      try { new Notification(title, { body }); } catch (e) {}
    }
  }

  function requestNotifPermission() {
    if (typeof Notification === "undefined") return;
    Notification.requestPermission().then(p => {
      notifPermission = p;
      rerender();
      if (p === "granted") notify("Reminders on", "You'll hear from this tab while it's open.");
    });
  }

  function getNotifyFlags() {
    saved.notifyFlags = saved.notifyFlags || {};
    const today = todayStr();
    if (!saved.notifyFlags[today]) saved.notifyFlags[today] = { idleNudge: false, streakRisk: false, slotsFired: {} };
    return saved.notifyFlags[today];
  }

  // If the last completed day isn't today or yesterday, the streak is
  // already broken — don't let the header keep showing a stale number
  // until the next time a task happens to be completed.
  function checkStreakDecay() {
    if (!saved) return;
    const today = todayStr();
    const yesterday = yesterdayStr();
    if (saved.streak > 0 && saved.lastCompleted && saved.lastCompleted !== today && saved.lastCompleted !== yesterday) {
      saved.streak = 0;
      persist();
    }
  }

  function runReminderChecks() {
    if (!saved) return;
    checkStreakDecay();
    const flags = getNotifyFlags();
    const now = new Date();
    const hour = now.getHours();
    const today = todayStr();
    const doneToday = (saved.history || []).some(h => h.date === today);

    if (!doneToday && hour >= 11 && !flags.idleNudge) {
      flags.idleNudge = true;
      persist();
      notify("Still time today", pick(quotePoolForMood(todaysMood())));
    }

    if (!doneToday && hour >= 19 && saved.streak > 0 && !flags.streakRisk) {
      flags.streakRisk = true;
      persist();
      notify("Your streak is waiting", `You're on a ${saved.streak}-day streak — one small task keeps it going.`);
    }

    const type = dayType(now);
    const plan = getSchedulePlan(type);
    const nowHM = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    plan.forEach(slot => {
      if (slot.remindAt && slot.remindAt === nowHM && !flags.slotsFired[slot.id]) {
        flags.slotsFired[slot.id] = true;
        persist();
        notify(slot.label || "Scheduled reminder", slot.text || "Time for your planned block.");
      }
    });
  }

  // ---------- Ambient background: a small field of drifting embers ----------
  // The pattern reseeds once a day (so it feels fresh without being distracting)
  // and grows a little denser as totalCompleted climbs, echoing the lamp.
  function initBackground() {
    const canvas = document.getElementById("bgCanvas");
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let w = 0, h = 0;
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = canvas.clientWidth || canvas.parentElement.clientWidth;
      h = canvas.clientHeight || canvas.parentElement.clientHeight;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    // day-seeded pseudo-random sequence, tied to the local calendar day so
    // it reseeds at local midnight rather than UTC midnight
    let seed = todayStr().split("-").reduce((n, part) => n * 37 + Number(part), 1);
    function rand() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }

    const completed = (saved && saved.totalCompleted) || 0;
    const count = Math.min(14 + completed, 42);
    const embers = Array.from({ length: count }, () => ({
      x: rand() * 100,
      y: rand() * 100,
      r: 0.6 + rand() * 1.5,
      speed: 0.15 + rand() * 0.3,
      driftAmp: 1.5 + rand() * 2.5,
      phase: rand() * Math.PI * 2,
      warm: rand() > 0.35
    }));

    function frame(t) {
      const mood = todaysMood();
      ctx.clearRect(0, 0, w, h);
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      if (mood === "rough") {
        grad.addColorStop(0, "#3B2A2E");
        grad.addColorStop(1, "#231A1D");
      } else if (mood === "good") {
        grad.addColorStop(0, "#3A1B0C");
        grad.addColorStop(1, "#1E0D05");
      } else {
        grad.addColorStop(0, "#2C1F42");
        grad.addColorStop(1, "#180F26");
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      const speedMul = mood === "rough" ? 0.45 : mood === "good" ? 1.7 : 1;
      const sizeMul = mood === "rough" ? 0.85 : mood === "good" ? 1.35 : 1;
      let warmColor = "#FF9A52", coolColor = "#5FD6C4";
      if (mood === "rough") { warmColor = "#F0A98C"; coolColor = "#E8C79A"; }
      else if (mood === "good") { warmColor = "#FFB23D"; coolColor = "#FF6A2E"; }

      const tt = reduceMotion ? 0 : t * speedMul;
      embers.forEach(p => {
        const yy = ((p.y - tt * 0.0006 * p.speed) % 100 + 100) % 100;
        const xx = ((p.x + Math.sin(tt * 0.0005 + p.phase) * p.driftAmp) % 100 + 100) % 100;
        const twinkle = 0.55 + 0.45 * Math.sin(tt * 0.0018 + p.phase * 2);
        ctx.globalAlpha = 0.25 + 0.45 * twinkle;
        ctx.fillStyle = p.warm ? warmColor : coolColor;
        ctx.beginPath();
        ctx.arc((xx / 100) * w, (yy / 100) * h, p.r * sizeMul, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      if (!reduceMotion) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function startTimer() {
    if (session.running) return;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    session.running = true;
    render();
    const endAt = Date.now() + session.secondsLeft * 1000;
    timerHandle = setInterval(() => {
      const remaining = Math.round((endAt - Date.now()) / 1000);
      if (remaining <= 0) {
        clearInterval(timerHandle);
        session.secondsLeft = 0;
        session.running = false;
        session.finished = true;
    celebrateCompletion();
        notify("Time's up", `Nice work — "${session.text}" is done.`);
        completeTask();
      } else {
        session.secondsLeft = remaining;
        const timerEl = app.querySelector(".timer");
        if (timerEl) timerEl.textContent = fmtTime(remaining);
      }
    }, 1000);
  }

  function logCompletion(text, minutes) {
    const today = todayStr();
    const timeStr = new Date().toTimeString().slice(0, 5);
    saved.history = saved.history || [];
    saved.history.push({ date: today, time: timeStr, text, minutes });
    deriveStatsFromHistory(saved);
    persist();
  }

  function completeTask() {
    logCompletion(session.text, session.minutes);
    render({ quote: pick(quotePoolForMood(todaysMood())) });
  }

  function init() {
    let state = null;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {
      state = null;
    }

    const today = todayStr();
    if (!state) {
      state = { startDate: today, lastCompleted: null, streak: 0, bestStreak: 0, totalCompleted: 0, history: [], personalNote: "", customTasks: [], journal: {}, videoLinks: [] };
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }
    if (!state.history) state.history = [];
    if (!state.customTasks) state.customTasks = [];
    if (!state.journal) state.journal = {};
    if (!state.videoLinks) state.videoLinks = [];
    if (!state.moodLog) state.moodLog = {};
    if (!state.scheduleLog) state.scheduleLog = {};
    if (!state.holidayDates) state.holidayDates = {};
    if (!state.buddy) state.buddy = null;

    saved = state;
    deriveStatsFromHistory(saved);
    checkStreakDecay();
    session = newTask();
    render();
    initBackground();
    window.addEventListener("storage", (e) => {
      if (e.key !== KEY || !e.newValue || !saved) return;
      try {
        saved = mergeSaved(saved, JSON.parse(e.newValue));
        rerenderGlobal();
      } catch (err) { /* ignore a malformed write from another tab */ }
    });
    setTimeout(runReminderChecks, 4000);
    setInterval(runReminderChecks, 60000);
    initCloud();
  }
  const _kpOriginalRender = render;
  render = function() {
    const result = _kpOriginalRender.apply(this, arguments);
    if (activeTab === "today") setTimeout(animateNewTask, 0);
    setTimeout(updateFloatingBuddy, 0);
    return result;
  };


  init();
})();
</script>
</div></div>
